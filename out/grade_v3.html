<script>
const ITEMS = [{"code": "Q040", "qid": "8", "type": "操作类", "q": "请问给其他模型如何配置正确的template模板", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(29.15) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(26.49) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(25.79) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(19.25) ｜ webdocs/getting_started__sft.md#eval_steps: 500(18.12) ｜ docs/zh/feature-guide/inference.md#推理(16.5)", "ref": "我们可以在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法为自定义模型注册 chat_template。", "ans": "要为其他模型配置正确的 `template` 模板，需要根据模型的具体需求和格式进行自定义。以下是一些关键步骤和注意事项：\n\n1. **理解模型的模板格式**：不同模型可能有不同的模板格式。例如，LLaMA-4 的模板格式包括用户消息、助手消息、系统消息和工具消息的特定格式。\n\n2. **使用 `custom_chat_template`**：如果你需要自定义模板，可以使用 `custom_chat_template` 参数，提供一个 Jinja2 模板字符串。例如：\n   ```yaml\n   model: path/to/model\n   custom_chat_template: >-\n     {% for message in messages %}\n     {{ message['role'] + ': ' + message['content'] }}\n     {% endfor %}\n   ```\n\n3. **注册模板**：对于更复杂的自定义需求，可以在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法为自定义模型注册 chat_template。这需要定义 `name`, `format_user`, `format_assistant`, `format_system` 与 `format_observation` 等字段。\n\n4. **多模态模型**：如果模型是多模态的，需要在 `mm_plugin` 字段中指定多模态插件。\n\n5. **示例模板**：参考 LLaMA-4 的模板格式，可以得到以下示例：\n   - 用户消息：`<|header_start|>user<|header_end|>\\n\\n{{content}}<|eot|>`\n   - 助手消息：`<|header_start|>assistant<|header_end|>\\n\\n{{content}}<|eot|>`\n   - 系统消息：`<|header_start|>system<|header_end|>\\n\\n{{content}}<|eot|>`\n   - 工具消息：`<|header_start|>ipython<|header_end|>\\n\\n\"{{content}}\"<|eot|>`\n\n6. **获取模板**：可以通过运行代码获取模型的模板，例如使用 `AutoTokenizer` 和 `apply_chat_template` 方法。\n\n通过以上步骤，你可以根据具体模型的需求和格式，正确配置和自定义 `template` 模板。如果资料中没有找到具体信息，请直接说明「资料里没有找到」。"}, {"code": "Q041", "qid": "47", "type": "参数类", "q": "建议增加参数控制最大的保存 checkpoint 数量 save_total_limit", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(72.39) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > Checkpoint 与日(55.55) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(51.61) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(51.56) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(38.35) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (31.81)", "ref": "该参数已存在：save_total_limit 控制最多保留多少个 checkpoint，超过数量限制时会自动删除较旧的 checkpoint，需配合 save_strategy 与 save_steps 使用。", "ans": "这个参数已经存在，无需额外增加。LlamaFactory 已支持 `save_total_limit` 参数，用于控制最多保留的 checkpoint 数量，超过限制时会自动删除最旧的 checkpoint。\n\n**参数说明**\n\n| 字段 | 类型 | 默认值 | 说明 |\n|------|------|--------|------|\n| `save_total_limit` | `int \\| None` | `None` | 最多保留数量 |\n\n**使用示例**\n\n该字段位于训练 YAML 的顶层：\n\n```yaml\noutput_dir: saves/qwen3_8b_lora_sft\nsave_strategy: steps\nsave_steps: 200\nsave_total_limit: 3\n```\n\n上述配置表示每 200 个 step 保存一次 checkpoint，最多保留 3 个最近的 checkpoint，超过后自动删除最旧的。\n\n补充说明：\n- `save_total_limit` 默认值为 `None`，即不限制保存数量\n- 它只删除**最旧的完整 checkpoint**\n- 可与按 step 保存（`save_steps`）或按 epoch 保存（`save_epochs`）配合使用；注意同时设置 `save_steps` 和 `save_epochs` 时，训练器会根据 `save_epochs` 重新计算并覆盖 `save_steps`"}, {"code": "Q042", "qid": "24", "type": "操作类", "q": "请问如何使用多机多卡推理呢？", "ctx": "webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(27.26) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(24.81) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.78) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(24.45) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(23.97) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (23.95)", "ref": "FORCE_TORCHRUN=1 NNODES=2 NODE_RANK=0 MASTER_ADDR=192.168.0.1 MASTER_PORT=29500 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml", "ans": "关于**多机多卡推理**的具体做法，资料里没有找到相关内容。\n\n资料中涉及的内容仅包括：\n\n1. **多机多卡训练**（非推理）：提供了多种启动方式，例如：\n   - 使用 Ray：主节点执行 `ray start --head --port=6379`，从节点执行 `ray start --address='master node IP:6379'`\n   - 使用 `llamafactory-cli` 配合 `FORCE_TORCHRUN`、`NNODES`、`NODE_RANK`、`MASTER_ADDR`、`MASTER_PORT` 等环境变量\n   - 使用 `deepspeed` 指令配合 hostfile\n   - 使用 `accelerate launch` 配合 FSDP 多节点配置（`num_machines`、`main_process_ip` 等）\n\n2. **推理配置**（资料中仅涉及单机推理）：例如 `examples/inference/qwen3.yaml` 中的配置：\n   ```yaml\n   model_name_or_path: Qwen/Qwen3-4B-Instruct-2507\n   template: qwen3_nothink\n   infer_backend: huggingface  # 可选 [huggingface, vllm]\n   trust_remote_code: true\n   ```\n\n如果您需要多机多卡推理的配置方法，建议查阅 LlamaFactory 官方文档中关于推理（inference）或 vllm 部分的更多内容。"}, {"code": "Q043", "qid": "53", "type": "操作类", "q": "（Instruct/Chat）模型对应的模板怎么找？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(32.43) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(22.03) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(21.97) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(19.25) ｜ docs/zh/feature-guide/inference.md#推理(18.58) ｜ docs/zh/feature-guide/inference.md#推理 > 启动 CLI 对话(17.15)", "ref": "通过观察输出我们可以得到模型的 chat_template。除此以外也可以通过 huggingface repo 来获取模型的 template.", "ans": "对于 Instruct/Chat 模型，获取其 chat template 的方法主要有以下几种：\n\n## 1. 用 `apply_chat_template` 打印模板（推荐）\n\n参考 [资料 4]，用 transformers 的 AutoTokenizer 向模型发送占位消息，打印出模板：\n\n```python\nfrom transformers import AutoTokenizer\n\ntokenizer = AutoTokenizer.from_pretrained(\"unsloth/Llama-4-Scout-17B-16E-Instruct\")\nmessages = [\n    {\"role\": \"user\", \"content\": r\"{{content}}\"},\n    {\"role\": \"assistant\", \"content\": r\"{{content}}\"},\n    {\"role\": \"system\", \"content\": r\"{{content}}\"},\n    {\"role\": \"tool\", \"content\": r\"{{content}}\"},\n]\n\ntext = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)\nprint(\"========== Template ==========\")\nprint(text)\n```\n\n## 2. 直接从 Hugging Face repo 获取\n\n[资料 4] 提到，除上述方法外，也可以通过 huggingface repo 直接获取模型的 template（即查看 tokenizer 相关配置文件中的 chat_template）。\n\n## 3. 观察输出、分析模板结构\n\n以 LLaMA-4 为例（[资料 2]），打印出的模板可以拆解为各消息类型的格式：\n\n| 消息类型 | 模板格式 |\n|---|---|\n| 用户消息 | `<|header_start|>user<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 助手消息 | `<|header_start|>assistant<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 系统消息 | `<|header_start|>system<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 工具消息 | `<|header_start|>ipython<|header_end|>\\n\\n\"{{content}}\"<|eot|>` |\n\n据此即可填写 `register_template` 的 `name`、`format_user`、`format_assistant`、`format_system`、`format_observation` 等字段（[资料 3]）。其中 `format_prefix` 通常在 `tokenizer_config.json` 中找，`stop_words` 可从 `generation_config.json` 的 eos_token_id 对应 token 中找。\n\n## 补充：LlamaFactory 中的使用方式\n\n- 推理时模型对话格式默认来自 tokenizer 自带的 Hugging Face chat template，没有模板时回退到内置 ChatML（[资料 5]）。\n- 如需覆盖 tokenizer 自带模板，v1 使用 `custom_chat_template` 传入 Jinja2 模板字符串，**不接受** `template: <name>` 字段（[资料 1]）：\n\n```yaml\nmodel: path/to/model\ncustom_chat_template: >-\n  {% for message in messages %}\n  {{ message['role'] + ': ' + message['content'] }}\n  {% endfor %}\n```\n\n- 如需为新模型注册内置 template，则在 `src/llamafactory/data/template.py` 中用 `register_template` 方法注册（[资料 3]）。"}, {"code": "Q044", "qid": "52", "type": "操作类", "q": "qwen2vl 7b , how to call api", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(38.55) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API(34.2) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(17.77) ｜ webdocs/getting_started__inference.md#推理¶(16.38) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(14.71) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(14.21)", "ref": "您可以使用 `llamafactory-clichatinference_config.yaml` 或 `llamafactory-cliwebchatinference_config.yaml` 进行推理与模型对话。", "ans": "资料里没有找到。"}, {"code": "Q045", "qid": "53", "type": "操作类", "q": "（Instruct/Chat）模型对应的模板怎么找？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(32.43) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(22.03) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(21.97) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(19.25) ｜ docs/zh/feature-guide/inference.md#推理(18.58) ｜ docs/zh/feature-guide/inference.md#推理 > 启动 CLI 对话(17.15)", "ref": "通过观察输出我们可以得到模型的 chat_template。除此以外也可以通过 huggingface repo 来获取模型的 template.", "ans": "模型对应的模板可以通过以下方法查找：\n\n1. 使用 `register_template` 方法为自定义模型注册 chat_template。在 `src/llamafactory/data/template.py` 中，可以找到 `register_template` 方法。\n\n2. 通过 Hugging Face 的 `AutoTokenizer` 获取模型的 template。例如，可以使用以下代码获取 LLaMA-4 模型的 template：\n\n```python\nfrom transformers import AutoTokenizer, AutoProcessor\n\ntokenizer = AutoTokenizer.from_pretrained(\"unsloth/Llama-4-Scout-17B-16E-Instruct\")\nmessages = [\n {\"role\": \"user\", \"content\": r\"{{content}}\"},\n {\"role\": \"assistant\", \"content\": r\"{{content}}\"},\n {\"role\": \"system\", \"content\": r\"{{content}}\"},\n {\"role\": \"tool\", \"content\": r\"{{content}}\"}\n]\n\ntext = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)\nprint(\"========== Template ==========\")\nprint(text)\n```\n\n通过上述代码，可以获取到模型的 chat_template。此外，也可以通过 Hugging Face 的 repo 来获取模型的 template。"}, {"code": "Q046", "qid": "21", "type": "操作类", "q": "有一个40G的数据集，但是由于他太大，所以跑sft出很多问题。如果把数据集拆成多个小数据集，如何配置训练？", "ctx": "docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(30.3) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 配置训练数据集(29.64) ｜ webdocs/advanced__distributed.md#分布训练¶(22.41) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 预训练数据集¶(22.24) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(21.03) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(17.97)", "ref": "训练 YAML 包含 `model`、`train_dataset` 等训练字段；数据集 YAML 以数据集名称为键，包含 `path`、`source`、`converter` 等字段。", "ans": "可以把 40G 的数据集拆成多个文件，然后通过**数据集 YAML 组合多个数据集**的方式配置训练。\n\n## 1. 编写数据集 YAML\n\n把拆分后的每个子集写成一个条目，例如 `data/my_sft.yaml`：\n\n```yaml\npart1:\n  path: data/part1.json\n  source: local\n  converter: sharegpt    # 按实际格式选择 alpaca / sharegpt / pair\n\npart2:\n  path: data/part2.json\n  source: local\n  converter: sharegpt\n\npart3:\n  path: data/part3.json\n  source: local\n  converter: sharegpt\n```\n\n## 2. 在训练 YAML 中引用\n\n训练 YAML 的 `train_dataset` 字段指向这个数据集 YAML：\n\n```yaml\ntrain_dataset: data/my_sft.yaml\n```\n\n`train_dataset` 也支持直接填本地数据文件/目录、HF Hub 数据集 ID 或 Hub 仓库中的 YAML。\n\n## 注意事项\n\n- **streaming 必须一致**：同一个 YAML 中所有条目的 `streaming` 配置必须一致，且当前训练路径**不支持 streaming 数据集**（保持默认 `false` 即可）。\n- **控制采样规模**：多个条目会组成一个全局数据索引，可用 `size`（重采样后的目标索引数量）和 `weight`（索引数量缩放倍率）控制每个子集的采样量。\n- **混合策略**：数据参数中的 `mix_strategy` 支持 `concat`、`interleave_under`、`interleave_over`，配合 `interleave_probs` 指定各数据集的采样概率。\n\n## 针对“数据太大”的辅助参数\n\n- `tokenized_path`：指定路径后，首次分词会保存 tokenized 数据集，之后直接加载，避免每次重复预处理 40G 数据。\n- `max_samples`：可将每个数据集截断到指定样本数（如果只是想先跑通）。\n- `packing` / `neat_packing`：启用序列打包提升训练效率（预训练时默认启用 packing）。\n- `preprocessing_num_workers`：增加预处理进程数，加快大数据集的预处理。\n\n另外提醒：`eval_dataset` 字段已定义，但评估流程尚未实现。"}, {"code": "Q047", "qid": "17", "type": "参数类", "q": "支持Qwen3-4B-Instruct-2507的KTO训练吗", "ctx": "webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > KTO¶(14.02) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > KTO 数据集¶(11.81) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > llamafactor(9.39) ｜ examples/train_lora/qwen3_lora_kto.yaml#examples/train_lora/qwen3_lora_kto.yaml(8.9) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶(5.21) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > RLHF¶(3.99)", "ref": "支持", "ans": "是的，支持Qwen3-4B-Instruct-2507的KTO训练。根据资料4中的配置示例，可以使用以下参数进行KTO训练：\n\n```\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntrust_remote_code: true\n\nstage: kto\ndo_train: true\nfinetuning_type: lora\nlora_rank: 8\nlora_target: all\npref_beta: 0.1\n\ndataset: kto_en_demo\ntemplate: qwen3_nothink\ncutoff_len: 2048\nmax_samples: 1000\npreprocessing_num_workers: 16\ndataloader_num_workers: 4\n\noutput_dir: saves/qwen3-4b/lora/kto\nlogging_steps: 10\nsave_steps: 500\nplot_loss: true\noverwrite_output_dir: true\nreport_to: none\n```\n\n此外，训练参数设置如下：\n\n```\nper_device_train_batch_size: 1\ngradient_accumulation_steps: 8\nlearning_rate: 5.0e-6\nnum_train_epochs: 3.0\nlr_scheduler_type: cosine\nwarmup_ratio: 0.1\nbf16: true\nddp_timeout: 180000000\n```"}, {"code": "Q048", "qid": "41", "type": "参数类", "q": "如何使用 flash_attn2 进行加速训练？按照提示加了 --flash_attn 参数，但对比发现加不加这个参数训练速度都一样", "ctx": "webdocs/advanced__acceleration.md#加速¶ > FlashAttention¶(25.74) ｜ webdocs/advanced__acceleration.md#加速¶ > Unsloth¶(18.32) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速(16.82) ｜ docs/zh/configuration/model.md#模型参数 > ModelArguments(15.85) ｜ webdocs/advanced__acceleration.md#加速¶ > Liger Kernel¶(14.69) ｜ docs/zh/feature-guide/index.md#功能指南 > 训练效率与扩展(14.27)", "ref": "在训练配置文件中添加参数 `flash_attn: fa2`（而不是命令行只写 --flash_attn）。", "ans": "根据资料，要使用 FlashAttention 进行加速训练，需要在启动训练时在训练配置文件中添加以下参数：\n\n```\nflash_attn: fa2\n```\n\n如果您已经按照提示添加了 `--flash_attn` 参数但发现训练速度没有变化，可能是因为您使用的参数格式不正确或者所处的环境不支持 FlashAttention。请确保参数格式正确，并且您的环境支持 FlashAttention。如果问题仍然存在，可能需要检查您的模型和训练配置是否兼容 FlashAttention。资料中没有提到具体如何验证参数是否正确或环境是否支持，因此建议您查阅相关文档或联系技术支持以获取更详细的帮助。"}, {"code": "Q049", "qid": "48", "type": "参数类", "q": "关于 packing 参数在 sft 阶段的疑问：为什么实际 batch 里的样本数和 micro_batch_size 对不上？", "ctx": "docs/zh/feature-guide/batching.md#批处理策略(46.38) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(28.56) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 并行与批大小¶(23.79) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(19.05) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(17.04) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > SFT 数据格式(15.47)", "ref": "因为动态策略中的 micro_batch_size 用于计算 token 预算，并不表示最终 batch 一定包含相同数量的样本。", "ans": "在 SFT 阶段，`packing` 参数控制是否启用 sequences packing。当 `packing` 设置为 `True` 时，模型会尝试将多个样本拼接成一个连续的序列，以提高效率。这种拼接方式可能导致实际 batch 中的样本数与 `micro_batch_size` 不一致，原因如下：\n\n1. **动态调整样本数**：`micro_batch_size` 是指每个 micro-batch 中样本的数量，但当使用动态批处理策略（如 `dynamic_batching` 或 `dynamic_padding_free`）时，实际选择的样本数会根据 token 预算动态调整，而不是固定数量。\n\n2. **sequences packing 的影响**：当启用 `packing` 时，模型会将多个样本拼接成一个连续的序列，这可能导致实际处理的样本数少于 `micro_batch_size`，因为拼接后的序列可能包含多个样本的数据。\n\n3. **token 预算限制**：动态批处理策略会根据 token 预算选择样本，这可能导致实际处理的样本数少于 `micro_batch_size`，尤其是在 token 预算有限的情况下。\n\n因此，实际 batch 中的样本数可能与 `micro_batch_size` 不一致，这是由于动态批处理策略和 sequences packing 的影响。"}, {"code": "Q050", "qid": "29", "type": "操作类", "q": "请问使用全参训练出的checkpoint如何与原始模型的权重进行合并？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(32.84) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(31.25) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(29.45) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > 全参训练(28.92) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(28.87) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(28.48)", "ref": "您可以通过 `llamafactory-cli exportmerge_config.yaml` 指令来合并模型。其中 `merge_config.yaml` 需要您根据不同情况进行配置。", "ans": "使用全参训练出的 checkpoint 与原始模型的权重进行合并，通常是在完成全参训练后，将训练得到的模型权重与原始模型的权重进行合并。不过，根据提供的资料，全参训练的模型（如 `outputs/qwen3_full`）已经包含了完整模型权重，而 LoRA 合并通常是在微调（如 SFT）后对适配器进行合并。如果您的问题是关于如何将全参训练的模型与原始模型进行合并，可能需要更具体的上下文或操作步骤。\n\n但根据资料，全参训练的模型已经包含了完整模型权重，不需要额外合并。如果您指的是将全参训练的模型与 LoRA 适配器合并，这通常是在微调后进行的步骤，而不是全参训练后的步骤。因此，资料中没有直接说明如何将全参训练的 checkpoint 与原始模型的权重进行合并，但全参训练的模型已经包含了完整权重，无需额外合并。"}, {"code": "Q051", "qid": "23", "type": "补充类", "q": "请问在推理或预测的时候如何指定 temperature 等参数？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(20.41) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(20.3) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(19.92) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(14.74) ｜ webdocs/getting_started__inference.md#推理¶(13.66) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(13.55)", "ref": "在推理配置中设置 `temperature`（默认 0.95，越高越随机、越低越确定）；同时可用 `top_p`（默认 0.7）与 `top_k`（默认 50）控制候选 token 集合大小。", "ans": "根据资料，这些生成参数可以直接写在推理配置文件（yaml）中，与 `model_name_or_path`、`template` 等参数并列即可。例如：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntemplate: qwen3_nothink\ninfer_backend: huggingface\ntrust_remote_code: true\ntemperature: 0.7\ntop_p: 0.9\n```\n\n可用的生成参数及其默认值如下（摘自参数介绍）：\n\n| 参数 | 说明 | 默认值 |\n|---|---|---|\n| `do_sample` | 是否使用采样策略，False 时使用 greedy decoding | True |\n| `temperature` | 越高越随机，越低越确定 | 0.95 |\n| `top_p` | 控制候选 token 集合（累积概率） | 0.7 |\n| `top_k` | 在概率最高的 top_k 个 token 中采样 | 50 |\n| `num_beams` | beam_search 束宽度，1 表示不用 | 1 |\n| `max_length` | 文本最大长度（含输入） | 1024 |\n| `max_new_tokens` | 生成文本最大长度，会覆盖 max_length | 1024 |\n| `repetition_penalty` | 重复 token 惩罚系数 | 1.0 |\n| `length_penalty` | beam_search 时的长度惩罚系数 | 1.0 |\n| `default_system` | 默认 system message | None |\n| `skip_special_tokens` | 解码时是否忽略特殊 token | True |\n\n配置文件写好后，按正常方式运行即可，例如：\n\n```bash\nllamafactory-cli chat inference_config.yaml\n```\n\n需要说明的是，资料中只给出了这些生成参数的名称与含义，未详细展示在 CLI 命令行中直接传参的方式，以上 yaml 写法是依据推理配置文件统一传参的方式给出的。"}, {"code": "Q052", "qid": "42", "type": "补充类", "q": "如何在 sft llama 时添加 special token？", "ctx": "webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > Supervised Fine(26.47) ｜ webdocs/advanced__extras.md#额外选项¶ > LLaMA Pro¶(13.45) ｜ webdocs/advanced__tuning_algorithms.md#调优算法¶ > Full Parameter Fine-tuning¶(11.33) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 基本参数¶(11.08) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > SFT 数据格式(9.84) ｜ webdocs/advanced__acceleration.md#加速¶ > Unsloth¶(7.97)", "ref": "使用 `new_special_tokens` 参数：要添加到 tokenizer 中的 special token，多个用逗号分隔，默认值为 None。", "ans": "根据资料，可以通过模型参数中的 `new_special_tokens` 来添加 special token：\n\n- **`new_special_tokens`**：要添加到 tokenizer 中的 special token，多个 special token 用逗号分隔，默认值为 `None`。\n\n配置示例：\n\n```yaml\n### 模型\nmodel_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct\n\n### 添加 special token（多个用逗号分隔）\nnew_special_tokens: \"<token1>,<token2>\"\n\n### 方法\nstage: sft\nfinetuning_type: lora\n```\n\n补充说明：资料中的模型参数表里还有一个相关参数 **`resize_vocab`**（是否调整词表和嵌入层的大小，默认 `False`）。不过资料中没有明确说明添加 special token 时是否必须配合开启 `resize_vocab`，如需确认具体搭配方式，建议查阅更详细的文档。"}, {"code": "Q053", "qid": "2", "type": "操作类", "q": "export model以后如何加载微调后的llama模型？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(35.0) ｜ docs/zh/feature-guide/model_export.md#模型导出(32.49) ｜ docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(31.89) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(29.78) ｜ docs/zh/feature-guide/model_export.md#模型导出 > 导出配置(29.09) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(27.72)", "ref": "将 `chat.yaml` 中的 `model` 改为 `outputs/qwen3_full`；完成[模型导出示例](model_export.md#导出配置)后，改为 `outputs/qwen3_merged`。这两种目录都包含完整模型权重，加载时移除此前的 `peft_config`，保留采样参数并运行 `llamafactory-cli chat chat.yaml`。", "ans": "导出模型后，可以按照以下步骤加载微调后的模型：\n\n1. 确保你已经通过 `llamafactory-cli merge` 命令成功合并了 LoRA 适配器，并且导出的模型目录（如 `outputs/qwen3_merged`）已经生成。\n\n2. 使用推理配置文件指定导出的模型路径。例如，在 `inference/qwen3_lora_sft.yaml` 中将 `model` 参数设置为导出的模型目录，如 `model: outputs/qwen3_merged`。\n\n3. 根据需要调整推理配置中的其他参数，如 `template`、`infer_backend` 等，确保它们与你的模型和硬件环境相匹配。\n\n4. 运行推理命令加载模型，例如使用 `llamafactory-cli chat chat.yaml` 命令进行推理。\n\n注意：在加载导出的模型时，不需要再指定 `peft_config`，但需要保留采样参数并确保配置文件正确。详细参数配置请参考[推理参数](../configuration/inference.md)。"}, {"code": "Q054", "qid": "37", "type": "参数类", "q": "freeze_trainable_layers 这个参数是什么含义？", "ctx": "webdocs/advanced__tuning_algorithms.md#... > Freeze¶(31.48) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶ > method(24.85) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(24.29) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > Freeze¶(22.29) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(21.76) ｜ docs/zh/quick_start.md#快速开始 > 文档导航(10.43)", "ref": "可训练层的数量：正数表示最后 n 层被设置为可训练的，负数表示前 n 层被设置为可训练的，默认值为 2。", "ans": "`freeze_trainable_layers` 参数用于指定在冻结微调（Freeze）过程中可训练的层的数量。正数表示最后 N 层被设置为可训练的，负数表示前 N 层被设置为可训练的。默认值为 2。例如，如果设置为 8，则表示最后 8 层被设置为可训练；如果设置为 -8，则表示前 8 层被设置为可训练。"}, {"code": "Q055", "qid": "24", "type": "操作类", "q": "请问如何使用多机多卡推理呢？", "ctx": "webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(27.26) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(24.81) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.78) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(24.45) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(23.97) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (23.95)", "ref": "FORCE_TORCHRUN=1 NNODES=2 NODE_RANK=0 MASTER_ADDR=192.168.0.1 MASTER_PORT=29500 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml", "ans": "根据提供的资料，使用多机多卡进行推理的配置方式可能涉及使用 `deepspeed` 或 `accelerate` 工具。以下是基于资料的示例配置：\n\n### 使用 DeepSpeed 进行多机多卡推理\n```\ndeepspeed --num_gpus 8 --num_nodes 2 --hostfile hostfile --master_addr hostname1 --master_port=9901 \\\nyour_program.py <normal cl args> --deepspeed ds_config.json\n```\n\n- `--num_gpus`: 每个节点上的 GPU 数量。\n- `--num_nodes`: 节点数量。\n- `--hostfile`: 指定主机文件，格式为 `hostname slots=number_of_gpus`。\n- `--master_addr`: 主节点的 IP 地址。\n- `--master_port`: 主节点的端口号。\n- `ds_config.json`: DeepSpeed 的配置文件。\n\n### 使用 Accelerate 进行多机多卡推理\n配置文件 `fsdp_config_multiple_nodes.yaml` 中需要设置以下参数：\n- `num_machines`: 节点数量。\n- `num_processes`: 所有节点上的 GPU 总数。\n- `main_process_ip`: 主进程所在节点的 IP 地址。\n- `main_process_port`: 主进程的端口号。\n- `machine_rank`: 当前节点的编号。\n\n启动命令：\n```\naccelerate launch \\\n--config_file fsdp_config_multiple_nodes.yaml \\\ntrain.py llm_config.yaml\n```\n\n请根据实际需求调整配置参数，并确保所有节点使用相同的 `master_addr` 和 `master_port`。资料中没有直接提供多机多卡推理的具体配置示例，但上述方法可以作为参考。"}, {"code": "Q056", "qid": "13", "type": "参数类", "q": "在训练过程中电脑突然重启，如何接着训练", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(47.54) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(45.83) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(37.9) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(32.01) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(31.69) ｜ docs/zh/feature-guide/index.md#功能指南 > 模型保存与使用(29.28)", "ref": "从 `output_dir` 中最新的完整 checkpoint 恢复训练状态。", "ans": "训练中断后，可以使用 `resume_from_checkpoint` 从 checkpoint 恢复训练，它会恢复模型、优化器、学习率调度器、批次进度、训练步数及可用的随机数状态。\n\n**方式一：指定具体 checkpoint 路径**\n\n```yaml\noutput_dir: saves/qwen3_8b_lora_sft\nresume_from_checkpoint: saves/qwen3_8b_lora_sft/checkpoint-1000\n```\n\n**方式二：自动查找最新 checkpoint**\n\n```yaml\nresume_from_checkpoint: auto\n```\n\n`auto` 会在 `output_dir` 下自动寻找最新的完整 checkpoint。\n\n**注意事项**\n\n1. **必须显式设置**：未设置 `resume_from_checkpoint` 时，即使 `output_dir` 中存在 checkpoint，也不会触发续训。\n2. **检查是否保存了完整训练状态**：如果此前开启了 `save_only_model: true`，由于未保存 optimizer、scheduler 等状态，不能进行完整的断点续训，此时保存结果只适合用于推理、评估或权重转换。\n3. **分布式训练**：如果是 FSDP2/FSDPTurbo 或 DeepSpeed 后端，checkpoint 中保存的是分布式训练状态（默认 `save_ckpt_as_hf: false`），用于续训没有问题；但若要导出 HF 格式权重需另行处理。\n\n**建议**：为避免下次中断丢失太多进度，可以配置按步数自动保存：\n\n```yaml\nsave_steps: 500        # 每 500 步保存一次\nsave_total_limit: 3    # 最多保留 3 个 checkpoint，删除最旧的\n```"}, {"code": "Q057", "qid": "4", "type": "参数类", "q": "为什么 yaml中设置的lora_rank和adapter config文件的lora_rank有2倍的关系，以哪个为准？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(14.86) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > LoRA¶(13.26) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > method(12.92) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > rsLoRA¶(9.15) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (8.74) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > method(8.0)", "ref": "文档中 lora_alpha（LoRA 缩放系数）一般为 lora_rank * 2，你看到的 2 倍关系很可能来自 lora_alpha 与 lora_rank 的这个关系；文档未说明两处 lora_rank 不一致时以哪个为准。", "ans": "根据资料，当使用 LoRA 微调时，`lora_rank` 是 LoRA 微调的本征维数 r，它决定了可训练的参数数量。在 YAML 配置中设置的 `lora_rank` 和 adapter config 文件中的 `lora_rank` 之间可能存在 2 倍的关系，这通常是因为 `lora_alpha` 的设置影响了 `lora_rank` 的实际效果。\n\n在 LoRA 中，`lora_alpha` 是 LoRA 缩放系数，一般情况下为 `lora_rank * 2`。因此，如果在 YAML 中设置的 `lora_rank` 和 adapter config 文件中的 `lora_rank` 有 2 倍的关系，可能是由于 `lora_alpha` 的设置导致的。在这种情况下，`lora_alpha` 的值通常会覆盖 YAML 中的 `lora_rank` 值，以确保 LoRA 的正确应用。\n\n因此，当 `lora_alpha` 被设置时，它会覆盖 YAML 中的 `lora_rank` 值，而 `lora_rank` 的实际值应根据 `lora_alpha` 的设置进行调整。如果 `lora_alpha` 没有被特别设置，那么 YAML 中的 `lora_rank` 和 adapter config 文件中的 `lora_rank` 应该是一致的。"}, {"code": "Q058", "qid": "22", "type": "操作类", "q": "vllm如何进行batch推理", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(39.49) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(32.4) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(31.44) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > 数据集¶(31.31) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(26.8) ｜ webdocs/getting_started__inference.md#推理¶(23.95)", "ref": "通过在指令 `python scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo` 中指定模型、数据集以使用 vllm 推理框架以取得更快的推理速度。", "ans": "根据资料，使用 vllm 进行批量推理的方式如下：\n\n**1. 使用批量推理脚本（推荐用于大量数据集）**\n\n通过 `scripts/vllm_infer.py` 脚本启动 vllm 推理引擎，对数据集进行批量推理并保存结果：\n\n```bash\npython scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo\n```\n\n- `--model_name_or_path`：指定模型路径（需为合并后的模型）\n- `--dataset`：指定要推理的数据集\n\n**2. 在推理配置中指定 vllm 后端**\n\n如果通过 `llamafactory-cli chat` 或 `llamafactory-cli webchat` 交互式推理，也可以在配置文件中指定 `infer_backend: vllm` 以获得更快的推理速度：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntemplate: qwen3_nothink\ninfer_backend: vllm  # choices: [huggingface, vllm]\ntrust_remote_code: true\n```\n\n**注意事项：**\n- 默认使用 Huggingface 引擎，需显式指定 `infer_backend: vllm` 才会使用 vllm\n- 模型 `model_name_or_path` 需要存在，且与 `template` 相对应\n- 除了 vllm 批量推理，也可以通过部署 API 服务的形式进行批量推理（例如：`API_PORT=8000 CUDA_VISIBLE_DEVICES=0 llamafactory-cli api examples/inference/qwen3_lora_sft.yaml`）\n\n关于批量推理输出结果的保存格式、更多脚本参数等细节，资料里没有找到。"}, {"code": "Q059", "qid": "8", "type": "操作类", "q": "请问给其他模型如何配置正确的template模板", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(29.15) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(26.49) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(25.79) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(19.25) ｜ webdocs/getting_started__sft.md#eval_steps: 500(18.12) ｜ docs/zh/feature-guide/inference.md#推理(16.5)", "ref": "我们可以在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法为自定义模型注册 chat_template。", "ans": "根据资料，为其他模型配置正确的 template 有以下几种方式：\n\n## 一、推理（v1）：使用 `custom_chat_template`\n\nv1 不接受 `template: <name>` 字段，而是直接用一段 Jinja2 模板字符串覆盖 tokenizer 自带模板：\n\n```yaml\nmodel: path/to/model\ncustom_chat_template: >-\n  {% for message in messages %}\n  {{ message['role'] + ': ' + message['content'] }}\n  {% endfor %}\n```\n\n注意：v1 的模型对话格式默认来自 tokenizer 自带的 Hugging Face chat template，没有模板时会回退到内置 ChatML。\n\n## 二、在代码中注册 template（`register_template`）\n\n在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法注册，需要填写以下字段：\n\n| 字段 | 说明 |\n|---|---|\n| `name` | 模板名称 |\n| `format_user` | 用户消息格式 |\n| `format_assistant` | 助手消息格式 |\n| `format_system` | 系统消息格式 |\n| `format_observation` | 工具输出格式 |\n| `format_prefix` | 模型的开头部分，通常可在 `tokenizer_config.json` 中找到 |\n| `stop_words` | 停止词，可在 `generation_config.json` 中找到 `eos_token_id`，再把对应的 token 填入 |\n| `mm_plugin` | 多模态模型需在此字段指定多模态插件 |\n\n注册时注意：用户消息和工具输出的模板中要附上助手回复的头部（如 `<|header_start|>assistant<|header_end|>`）来引导模型回复，因此 `format_assistant` 只保留内容部分（如 `{{content}}<|eot|>`）。\n\n## 三、如何获取模型原有 template\n\n可以用以下脚本打印模型的 chat template 作为参考，也可以直接去 HuggingFace repo 查看：\n\n```python\nfrom transformers import AutoTokenizer, AutoProcessor\n\ntokenizer = AutoTokenizer.from_pretrained(\"unsloth/Llama-4-Scout-17B-16E-Instruct\")\nmessages = [\n {\"role\": \"user\", \"content\": r\"{{content}}\"},\n {\"role\": \"assistant\", \"content\": r\"{{content}}\"},\n {\"role\": \"system\", \"content\": r\"{{content}}\"},\n {\"role\": \"tool\", \"content\": r\"{{content}}\"}\n]\n\ntext = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)\nprint(\"========== Template ==========\")\nprint(text)\n```\n\n通过观察输出，即可归纳出该模型各类消息（user / assistant / system / tool）的模板格式，再据此填写 `register_template` 的各字段。\n\n## 四、训练（SFT）时\n\n在训练配置中使用 `template` 字段指定数据集模板，**必须保证与模型相对应**：\n\n```yaml\ntemplate: <与模型对应的模板名>\n```"}, {"code": "Q060", "qid": "34", "type": "操作类", "q": "deepspeed 单机多卡sft时，如何只保存模型", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 仅保存模型权重¶(43.34) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(41.58) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(39.98) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(38.33) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(36.91) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(36.27)", "ref": "设置 `save_only_model: true`，deepspeed 训练时同样只保存模型权重。", "ans": "在 DeepSpeed 后端下，若只想保存模型权重（不保存 optimizer、scheduler 等训练状态），可以设置：\n\n```yaml\nsave_only_model: true\n```\n\n**注意事项：**\n\n1. **无法完整断点续训**：由于缺少 optimizer、scheduler 等训练状态，之后通常不能严格意义上的完整 resume。这种保存结果更适合用于推理、评估或后续权重转换（见资料中的备注）。\n\n2. **HF 格式权重**：DeepSpeed 默认的 checkpoint 保存的是 DeepSpeed 训练状态。如果希望得到 HF 格式的模型权重，可以额外开启：\n\n```yaml\nsave_ckpt_as_hf: true\n```\n\n这会在 checkpoint 中额外生成 `hf_model` 目录。但需要注意：\n- 开启后仍会保留用于恢复训练的原始 checkpoint；\n- 聚合完整模型权重会提高保存时的内存占用；\n- `save_ckpt_as_hf: false` 是默认值。\n\n**补充说明**：资料中没有明确说明 `save_only_model: true` 与 `save_ckpt_as_hf: true` 在 DeepSpeed 下同时开启时的具体组合行为，如需确认建议实际测试或查阅更详细的文档。"}, {"code": "Q061", "qid": "12", "type": "参数类", "q": "我想接着checkpoint继续train 该怎么办呢", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(54.89) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(44.89) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > Checkpoint 与日(35.75) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(33.79) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(33.79) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (32.74)", "ref": "设置 `resume_from_checkpoint: auto` 并在 `output_dir` 下寻找最新的完整 checkpoint。", "ans": "接着 checkpoint 继续训练，使用 `resume_from_checkpoint` 参数即可。\n\n**两种写法**\n\n1. 指定具体 checkpoint 路径（推荐指向具体的 checkpoint 目录）：\n\n```yaml\noutput_dir: saves/qwen3_8b_lora_sft\nresume_from_checkpoint: saves/qwen3_8b_lora_sft/checkpoint-1000\n```\n\n2. 自动查找 `output_dir` 下最新的完整 checkpoint：\n\n```yaml\nresume_from_checkpoint: auto\n```\n\n**注意事项**\n\n- 未设置 `resume_from_checkpoint` 时，即使 `output_dir` 中存在 checkpoint，也不会触发续训。\n- 恢复时会加载模型、优化器、学习率调度器、批次进度、训练步数及可用的随机数状态，可严格接续之前的训练进度。\n- 如果之前保存时开启了 `save_only_model: true`（未保存 optimizer、scheduler 等状态），则无法完整断点续训，保存结果只适合用于推理、评估或权重转换。\n- 如果使用 Megatron Bridge 训练，则不要依赖 Hugging Face 的 `resume_from_checkpoint` 语义：保持相同 `output_dir` 并设置 `overwrite_output_dir: false`，存在 `latest_checkpointed_iteration.txt` 或 `latest_train_state.pt` 时会自动从该目录恢复。"}, {"code": "Q062", "qid": "3", "type": "补充类", "q": "rm 阶段 do_predict 的 accept_score 和 reject_score 如何理解？", "ctx": "webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > RLHF¶ > Reward (19.1) ｜ webdocs/getting_started__eval.md#评估¶ > NLG 评估¶ > model(8.23) ｜ webdocs/getting_started__eval.md#评估¶ > 通用能力评估¶ > model(8.18) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > model(8.05) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > model(8.03) ｜ examples/extras/nlg_eval/llama3_lora_predict.yaml#examples/extras/nlg_eval/llama3_lora_pre(6.5)", "ref": "rm 入口训练回答评分模型，使 chosen 回答的评分高于 rejected 回答；若某些样本的 accept_score 与 reject_score 接近，说明该样本的评分接近，难以区分接受或拒绝。", "ans": "资料里没有找到关于 rm 阶段 `do_predict` 中 `accept_score` 和 `reject_score` 的说明。\n\n现有资料中与 reward model 相关的内容只提到：\n- 训练奖励模型时将 `stage` 设置为 `rm`\n- 数据集需符合偏好数据集格式（输入、好的回答、坏的回答三部分）\n- 需指定奖励模型的保存路径，例如 `output_dir: saves/llama3-8b/lora/reward`\n\n关于预测（do_predict）阶段输出的分数指标含义，资料中没有相关描述，无法给出准确解释。"}, {"code": "Q063", "qid": "36", "type": "补充类", "q": "model.chat 功能怎么在框架内批量使用呢？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(47.1) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > 数据集¶(37.7) ｜ webdocs/getting_started__inference.md#推理¶(29.52) ｜ docs/zh/feature-guide/inference.md#推理(23.13) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(20.3) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(19.92)", "ref": "使用 `llamafactory-cli chat inference_config.yaml` 或 `llamafactory-cli webchat inference_config.yaml` 进行推理与模型对话。", "ans": "根据资料，`model.chat` 功能是用于交互式单条推理的，不支持批量推理。如果需要进行批量推理，可以使用 `vllm_infer.py` 脚本，通过指定模型路径和数据集进行批量处理。具体命令如下：\n\n```\npython scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo\n```\n\n如果您希望使用 vllm 推理引擎进行批量推理，可以将 `infer_backend` 设置为 `vllm`。例如，在配置文件中指定：\n\n```\ninfer_backend: vllm\n```\n\n这样可以利用 vllm 推理引擎进行更高效的批量推理。"}, {"code": "Q064", "qid": "39", "type": "操作类", "q": "如何指定只冻结 LLM 进行多模态模型的训练？", "ctx": "webdocs/advanced__tuning_algorithms.md#... > Freeze¶(33.22) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(27.6) ｜ docs/zh/configuration/model.md#模型参数 > ModelArguments(25.71) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(25.07) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > 基本参数¶(22.2) ｜ webdocs/advanced__model_support.md#模型支持¶ > 多模态数据构建¶(19.21)", "ref": "Freeze 直接更新指定层或模块的权重，其余参数保持冻结。", "ans": "要指定只冻结 LLM 进行多模态模型的训练，您需要设置 `freeze_vision_tower` 为 `True`，这样在训练多模态模型时，视觉塔部分将被冻结，而 LLM 部分则继续训练。此外，确保您的 `peft_config` 中正确配置了冻结的层或模块。例如，您可以使用以下配置：\n\n```yaml\npeft_config:\n  name: freeze\n  freeze_trainable_layers: 2\n  freeze_trainable_modules: all\n  freeze_extra_modules: null\n  cast_trainable_params_to_fp32: true\n```\n\n同时，在模型参数中设置：\n\n```yaml\nmodel_arguments:\n  freeze_vision_tower: True\n```\n\n这样，多模态模型在训练时，视觉塔部分将被冻结，而 LLM 部分则继续训练。"}, {"code": "Q065", "qid": "10", "type": "操作类", "q": "请问单机多卡怎么训练", "ctx": "webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > accelerate¶(41.12) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > torchrun¶(40.73) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(33.81) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(33.71) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 单机多卡¶ > (33.3) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > llamafactor(31.99)", "ref": "您可以使用 llamafactory-cli 启动 NativeDDP 引擎。", "ans": "单机多卡训练可以通过多种方式实现，以下是几种常见的方法：\n\n1. **使用 `accelerate`**：\n   - 运行 `accelerate config` 生成配置文件，根据需求回答问题后生成配置文件。\n   - 配置文件中可以指定 `num_machines` 和 `num_processes` 来控制节点数和GPU数量。\n\n2. **使用 `torchrun`**：\n   - 示例命令：\n     ```\n     torchrun --standalone --nnodes=1 --nproc-per-node=8 src/train.py \\\n     --stage sft \\\n     --model_name_or_path meta-llama/Meta-Llama-3-8B-Instruct \\\n     --do_train \\\n     --dataset alpaca_en_demo \\\n     --template llama3 \\\n     --finetuning_type lora \\\n     --output_dir saves/llama3-8b/lora/ \\\n     --overwrite_cache \\\n     --per_device_train_batch_size 1 \\\n     --gradient_accumulation_steps 8 \\\n     --lr_scheduler_type cosine \\\n     --logging_steps 100 \\\n     --save_steps 500 \\\n     --learning_rate 1e-4 \\\n     --num_train_epochs 2.0 \\\n     --plot_loss \\\n     --bf16\n     ```\n\n3. **使用 `deepspeed`**：\n   - 示例命令：\n     ```\n     deepspeed --num_gpus 8 src/train.py \\\n     --deepspeed examples/deepspeed/ds_z3_config.json \\\n     --stage sft \\\n     --model_name_or_path meta-llama/Meta-Llama-3-8B-Instruct \\\n     --do_train \\\n     --dataset alpaca_en \\\n     --template llama3 \\\n     --finetuning_type full \\\n     --output_dir saves/llama3-8b/lora/full \\\n     --overwrite_cache \\\n     --per_device_train_batch_size 1 \\\n     --gradient_accumulation_steps 8 \\\n     --lr_scheduler_type cosine \\\n     --logging_steps 10 \\\n     --save_steps 500 \\\n     --learning_rate 1e-4 \\\n     --num_train_epochs 2.0 \\\n     --plot_loss \\\n     --bf16\n     ```\n\n4. **使用 `llamafactory-cli`**：\n   - 示例命令（使用 NativeDDP）：\n     ```\n     FORCE_TORCHRUN=1 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml\n     ```\n   - 如果需要指定GPU，可以使用：\n     ```\n     FORCE_TORCHRUN=1 CUDA_VISIBLE_DEVICES=0,1 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml\n     ```\n\n这些方法都可以用于单机多卡训练，具体选择取决于您的需求和环境配置。"}, {"code": "Q066", "qid": "21", "type": "操作类", "q": "有一个40G的数据集，但是由于他太大，所以跑sft出很多问题。如果把数据集拆成多个小数据集，如何配置训练？", "ctx": "docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(30.3) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 配置训练数据集(29.64) ｜ webdocs/advanced__distributed.md#分布训练¶(22.41) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 预训练数据集¶(22.24) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(21.03) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(17.97)", "ref": "训练 YAML 包含 `model`、`train_dataset` 等训练字段；数据集 YAML 以数据集名称为键，包含 `path`、`source`、`converter` 等字段。", "ans": "根据提供的资料，可以将一个大的数据集拆分成多个小数据集，并通过配置训练参数来处理。具体来说，可以使用 `train_dataset` 字段指定多个数据集，每个数据集可以通过 YAML 文件描述其路径、来源、split、converter 和采样配置，并支持组合多个数据集。\n\n在训练配置中，可以使用 `dataset` 参数指定多个数据集，用逗号分隔。例如，如果拆分成两个小数据集，可以这样配置：\n\n```bash\n--dataset dataset1,dataset2\n```\n\n其中 `dataset1` 和 `dataset2` 是描述每个小数据集的 YAML 文件或路径。\n\n此外，可以使用 `mix_strategy` 参数来控制数据集的混合策略，支持 `concat`、`interleave_under`、`interleave_over`。如果希望数据集之间进行交错采样，可以设置：\n\n```bash\n--mix_strategy interleave_under\n```\n\n或者：\n\n```bash\n--mix_strategy interleave_over\n```\n\n如果希望使用交错策略，并指定从多个数据集中采样的概率，可以使用 `interleave_probs` 参数，例如：\n\n```bash\n--interleave_probs 0.5,0.5\n```\n\n这样，训练过程会从多个数据集中按指定概率交错采样，从而避免处理单个大数据集时出现的问题。同时，确保 `streaming` 配置一致，因为同一个 YAML 中的 streaming 配置必须一致，且当前训练路径不支持 streaming 数据集。"}, {"code": "Q067", "qid": "11", "type": "参数类", "q": "推理可以直接设置do_sample=False的贪心采样策略吗", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(27.02) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(20.41) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(20.3) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(19.92) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(14.74) ｜ docs/zh/configuration/inference.md#推理参数 > SampleArguments(14.67)", "ref": "可以直接设置do_sample=False的贪心采样策略。", "ans": "可以。根据资料，`do_sample` 是一个生成参数（bool 类型，默认为 `True`），将其设置为 `False` 时就会使用 greedy decoding（贪心解码）。\n\n在推理配置 yaml 中直接添加即可，例如：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntemplate: qwen3_nothink\ninfer_backend: huggingface #choices： [huggingface, vllm]\ntrust_remote_code: true\ndo_sample: false\n```\n\n补充说明：默认情况下 `do_sample=True`，此时会配合 `temperature`（默认 0.95）、`top_p`（默认 0.7）、`top_k`（默认 50）等采样参数工作；改为 `False` 后则不再使用采样策略。"}, {"code": "Q068", "qid": "48", "type": "参数类", "q": "关于 packing 参数在 sft 阶段的疑问：为什么实际 batch 里的样本数和 micro_batch_size 对不上？", "ctx": "docs/zh/feature-guide/batching.md#批处理策略(46.38) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(28.56) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 并行与批大小¶(23.79) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(19.05) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(17.04) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > SFT 数据格式(15.47)", "ref": "因为动态策略中的 micro_batch_size 用于计算 token 预算，并不表示最终 batch 一定包含相同数量的样本。", "ans": "这个现象在资料里有对应解释，关键看你的 `batching_strategy` 设置：\n\n**1. 动态批处理策略下，`micro_batch_size` 不是固定样本数（最常见原因）**\n\n当 `batching_strategy` 为 `dynamic_batching` 或 `dynamic_padding_free` 时，`micro_batch_size` 只用于计算 **token 预算**：\n\n```\ntoken 预算 = cutoff_len × micro_batch_size\n```\n\n例如 `cutoff_len: 2048`、`micro_batch_size: 4` 时预算为 8192：\n\n- `dynamic_batching`：在「最长样本长度 × 样本数 ≤ 8192」范围内决定实际样本数，再按最长样本 padding；\n- `dynamic_padding_free`：在「样本总长度 ≤ 8192」范围内决定实际样本数，并拼接所选样本。\n\n所以短样本多的 batch 会装入更多条样本，长样本多的 batch 更少——实际样本数随数据长度波动，这是预期行为。资料明确指出：动态策略中的 `micro_batch_size` 用于计算 token 预算，**并不表示最终 batch 一定包含相同数量的样本**。\n\n**2. `padding_free` 策略**\n\n仍固定选 `micro_batch_size` 条样本，但会拼接成一条连续序列以移除 padding，因此从序列形态上看也与常规 batch 不同。\n\n**3. 动态策略下 `global_batch_size` 的含义**\n\n动态策略中一次更新的实际样本数随长度变化，`global_batch_size` 只决定累积次数（`global_batch_size / (dp_size × micro_batch_size)`），不保证每次更新的样本总数固定。\n\n**关于 packing 参数本身**\n\n资料中 `packing` 的定义是「是否启用 sequences packing，预训练时默认启用」（默认 `None`），但 SFT 阶段开启 packing 后 batch 内样本如何组成，**资料里没有找到**更详细的说明。若你用的是 Megatron Bridge，另有 `use_packed_sequences` 参数，且 `context_parallel_size>1` 时 SFT 会强制 `calculate_per_token_loss=true`，packed 序列按 `CP*2` 对齐。\n\n**补充**：多轮对话会按每个受监督的 assistant turn 展开为多条训练样本，如果你是在对比「原始数据条数 vs batch 内样本数」，也会因此对不上。\n\n建议先检查你的 `batching_strategy`：若确实用的是 `normal`（固定选 `micro_batch_size` 条样本）且样本数仍对不上，这属于资料未覆盖的情况。"}, {"code": "Q069", "qid": "44", "type": "参数类", "q": "Support Liger Kernel for Qwen3.5", "ctx": "docs/zh/feature-guide/kernel_acceleration.md#融合算子加速 > Liger Kernel(32.67) ｜ webdocs/advanced__acceleration.md#加速¶ > Liger Kernel¶(26.74) ｜ docs/zh/configuration/model.md#模型参数 > kernel_config(9.13) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速(8.41) ｜ examples/extras/fp8/llama3_fp8_fsdp_sft.yaml#examples/extras/fp8/llama3_fp8_fsdp_sft.(6.53) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速 > 自动配置(4.97)", "ref": "通过 `kernel_config` 统一配置模型侧的融合算子加速（如 Liger Kernel）。`kernel_config.name` 接受加速实现名称，也可用逗号分隔多个；未设置或设为 null 时不做算子替换。", "ans": "要支持 Qwen3.5 使用 Liger Kernel，您需要在训练配置文件中设置 `kernel_config` 参数为 `liger_kernel`。具体配置如下：\n\n```yaml\nkernel_config:\n  name: liger_kernel\n```\n\n此外，确保在训练配置中启用 Liger Kernel：\n\n```\nenable_liger_kernel: True\n```\n\n同时，根据您的硬件设备（如 NPU 或 CUDA）配置相应的参数。如果使用 NPU，可以利用其默认的融合算子组合；如果使用 CUDA，则需确保模型支持 Liger Kernel 和 CUDA Fused MoE。"}, {"code": "Q070", "qid": "41", "type": "参数类", "q": "如何使用 flash_attn2 进行加速训练？按照提示加了 --flash_attn 参数，但对比发现加不加这个参数训练速度都一样", "ctx": "webdocs/advanced__acceleration.md#加速¶ > FlashAttention¶(25.74) ｜ webdocs/advanced__acceleration.md#加速¶ > Unsloth¶(18.32) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速(16.82) ｜ docs/zh/configuration/model.md#模型参数 > ModelArguments(15.85) ｜ webdocs/advanced__acceleration.md#加速¶ > Liger Kernel¶(14.69) ｜ docs/zh/feature-guide/index.md#功能指南 > 训练效率与扩展(14.27)", "ref": "在训练配置文件中添加参数 `flash_attn: fa2`（而不是命令行只写 --flash_attn）。", "ans": "## 正确配置方式\n\n根据资料，启用 FlashAttention 的写法是在**训练配置文件**中添加参数（webdocs/advanced__acceleration.md）：\n\n```yaml\nflash_attn: fa2\n```\n\n但需要注意：ModelArguments 配置文档（docs/zh/configuration/model.md）中显示 `flash_attn` 的定义是——\n\n| 字段 | 类型 | 默认值 | 可选值 |\n|------|------|--------|--------|\n| `flash_attn` | `str` | `sdpa` | `eager`、`sdpa`、`flash_attention_2` |\n\n两份资料给出的取值写法**不一致**（`fa2` vs `flash_attention_2`）。建议优先按 ModelArguments 文档使用 `flash_attention_2`，若不生效再尝试 `fa2` 写法。\n\n## 排查建议\n\n针对「加不加速度都一样」，可能的原因：\n\n1. **参数没有赋有效值**：如果只写了 `--flash_attn` 而没有指定值，参数不会生效，实际仍使用默认的 `sdpa`。\n2. **取值不在合法范围内**：如果传入的值不是 `eager` / `sdpa` / `flash_attention_2` 之一，可能无法按预期启用 FlashAttention。\n3. **默认值本身已是 `sdpa`**：资料中未提供 sdpa 与 flash_attention_2 的速度对比数据，无法从资料判断二者差异大小。\n\n建议先确认实际传入的值是否为有效取值（如 `flash_attention_2`），再对比训练速度。资料中没有关于 FlashAttention 硬件要求或日志验证方法的说明，如需进一步排查请查阅对应版本文档。"}, {"code": "Q071", "qid": "59", "type": "补充类", "q": "请教下在 finetuning_type 为 full 的情况下，冻结参数的设置会生效吗？", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > Freeze¶(32.93) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶ > method(29.48) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(25.54) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > 基本参数¶(23.82) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶(22.97) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(22.32)", "ref": "Freeze 是独立的微调方法（`finetuning_type: freeze`），直接更新指定层或模块的权重、其余参数保持冻结；文档未说明 finetuning_type 为 full 时该配置是否生效。", "ans": "根据提供的资料，**没有直接说明 `finetuning_type: full` 时冻结参数是否生效**，无法给出确切结论。\n\n资料中能确认的信息是：\n\n1. `freeze_trainable_layers`、`freeze_trainable_modules`、`freeze_extra_modules` 这几个参数属于 **Freeze（冻结微调）方法** 的参数（资料 1、3）。\n2. 资料 5 明确写道：如需进行冻结微调，请将 `finetuning_type` 设置为 `freeze` 并设置相关参数，给出的示例配置也是：\n   ```yaml\n   stage: sft\n   finetuning_type: freeze\n   freeze_trainable_layers: 8\n   freeze_trainable_modules: all\n   ```\n3. 在新版配置中，Freeze 对应 `peft_config` 里的 `name: freeze`，用来替换 LoRA 配置（资料 6）。\n\n也就是说，资料表明这些冻结参数是配合 `finetuning_type: freeze` 使用的；至于在 `full`（全参微调）模式下设置这些参数会有什么行为（生效、忽略还是报错），资料里没有找到相关说明，建议以实际代码行为或官方进一步文档为准。\n\n另外补充一点：资料 4 中还有 `freeze_vision_tower`、`freeze_multi_modal_projector` 这类参数，它们是 MLLM（多模态模型）训练时的**基本参数**，与 Freeze 微调方法无关，不依赖 `finetuning_type` 的取值。"}, {"code": "Q072", "qid": "40", "type": "参数类", "q": "如何取部分数据集训练", "ctx": "docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(32.33) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(24.09) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 配置训练数据集(23.98) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 预训练数据集¶(20.55) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(17.13) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(15.99)", "ref": "使用 `max_samples` 参数：设置后，每个数据集的样本数会被截断至指定的 max_samples（默认 None，即不限制）。", "ans": "在LlamaFactory中，可以通过设置`size`和`weight`参数来控制数据集的采样规模，从而取部分数据集进行训练。具体来说，`size`和`weight`用于指定数据集展开后的训练索引数量，计算顺序如下：\n\n1. 设置`size`后，先从展开后的索引中有放回抽取`size`个条目；省略时保留完整索引。\n2. 设置`weight`后，再从上一步结果中有放回抽取`int(当前条目数 × weight)`个条目，小数部分向下取整；省略时保留上一步结果。\n\n例如，如果设置`size: 1000`与`weight: 0.5`，则先抽取1000个条目，再抽取其中的500个条目，最终规模为500，但可能包含重复条目，也可能没有覆盖某些原始记录。\n\n在数据集YAML配置中，可以这样设置：\n\n```yaml\nidentity:\n  path: data/identity.json\n  source: local\n  converter: alpaca\n  size: 1000\n  weight: 0.5\n  streaming: false\n```\n\n上述配置表示从`data/identity.json`数据集中加载数据，使用`alpaca`转换器，设置`size`为1000，`weight`为0.5，从而控制数据集的采样规模。"}, {"code": "Q073", "qid": "33", "type": "操作类", "q": "调用api_demo的时候如何能切换多个微调后的lora模型 —— 目前是这样运行 但只能加载固定一个lora模型，    api调用的时候可以通过model参数切换lora模型吗", "ctx": "docs/zh/feature-guide/model_export.md#模型导出 > 合并多个 Adapter(38.47) ｜ docs/zh/feature-guide/inference.md#推理 > 使用 LoRA Adapter(36.06) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > LoRA(33.62) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > LoRA¶(27.39) ｜ docs/zh/feature-guide/model_export.md#模型导出(26.9) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > model(26.82)", "ref": "通过 `peft_config.adapter_name_or_path` 指定 adapter。", "ans": "在调用 API 时，可以通过 `model` 参数指定不同的 LoRA 模型。具体来说，`model` 参数用于指定训练时的基座模型，而 `peft_config.adapter_name_or_path` 用于指定 LoRA adapter。因此，如果你希望切换不同的 LoRA 模型，可以修改 `peft_config.adapter_name_or_path` 的值为不同的 adapter 路径。\n\n例如，如果你有多个 LoRA adapter，可以这样配置：\n\n```yaml\npeft_config:\n  name: lora\n  adapter_name_or_path: outputs/lora_model1\n```\n\n或者切换到另一个模型：\n\n```yaml\npeft_config:\n  name: lora\n  adapter_name_or_path: outputs/lora_model2\n```\n\n这样在调用 API 时，就可以通过修改 `adapter_name_or_path` 的值来切换不同的 LoRA 模型。确保每个 `adapter_name_or_path` 指向一个有效的 LoRA adapter 目录，并且这些目录与基座模型匹配。"}, {"code": "Q074", "qid": "46", "type": "参数类", "q": "如何自动保存checkpoint?", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(48.14) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(45.63) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > Checkpoint 与日(44.35) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(40.14) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(28.03) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(27.62)", "ref": "设置 `save_steps` 和 `save_epochs` 参数自动保存checkpoint。`save_steps` 默认为500，`save_epochs` 默认为null。", "ans": "要自动保存 checkpoint，需要在训练配置中设置 `save_strategy` 参数为 `steps` 或 `epoch`，并根据需要配置 `save_steps` 或 `save_epochs`。例如，若希望按 step 保存，可设置：\n\n```\nsave_strategy: steps\nsave_steps: 200\nsave_total_limit: 3\n```\n\n这表示训练过程中每 200 个 step 保存一次 checkpoint，并且最多保留 3 个最近的 checkpoint。若希望按 epoch 保存，可设置：\n\n```\nsave_strategy: epoch\n```\n\n此外，若希望从 `output_dir` 中最新的完整 checkpoint 恢复训练，可设置：\n\n```\nresume_from_checkpoint: auto\n```\n\n以上配置会自动查找 `output_dir` 下的最新 checkpoint 以恢复训练。"}, {"code": "Q075", "qid": "38", "type": "操作类", "q": "开启视觉模型的api之后怎么给他传图片？", "ctx": "webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 多模态数据集¶ > 图像数据集¶(38.36) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 多模态模型¶(22.27) ｜ webdocs/advanced__model_support.md#模型支持¶ > 多模态数据构建¶(21.36) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 多模态数据集¶ > 视频数据集¶(19.7) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 多模态数据集¶ > 音频数据集¶(19.7) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(18.54)", "ref": "多模态图像数据集需要额外添加一个 `images` 列，包含输入图像的路径。", "ans": "资料里没有找到关于「启动视觉模型 API 后如何传图」的内容。\n\n提供的资料中与多模态相关的内容只涉及：\n\n1. **训练数据准备**：图像数据集需添加 `images` 列，图片数量必须与文本中 `<image>` 标记数量严格一致，并在 `dataset_info.json` 中配置对应列映射。\n2. **多模态模型参数**：如 `image_max_pixels`（默认 768x768）、`image_min_pixels`（默认 32x32）等。\n3. **多模态推理**：仅介绍了 `llamafactory-cli webchat examples/inference/qwen3vl.yaml` 这种 webchat 方式，未涉及 API 服务的图片传入方式。\n\n如需了解 API 接口如何传图（例如 OpenAI 风格接口的 `image_url`/base64 格式），建议查阅 LlamaFactory 官方文档中关于 API 部分的说明，资料中没有相关依据，无法给出准确回答。"}, {"code": "Q076", "qid": "35", "type": "补充类", "q": "How to train the mm_proj and the LLM part with lora of Qwen2-VL？", "ctx": "docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(22.58) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > 基本参数¶(21.48) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶(20.65) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > 全参训练(19.97) ｜ docs/zh/configuration/model.md#模型参数 > ModelArguments(19.34) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(18.93)", "ref": "由 `train_mm_proj_only` 控制：默认 false 表示同时训练多模态投影器与 LLM 部分；设为 true 则仅训练投影器。", "ans": "根据资料，要让 Qwen2-VL 的 mm_proj（多模态投影器）和 LLM 部分一起用 LoRA 训练，关键是以下几个参数（见「微调参数 > 基本参数」）：\n\n- `finetuning_type: lora`（默认值，显式设置即可）\n- `freeze_multi_modal_projector: false` —— 默认为 `true`（冻结多模态投影器），必须改为 `false` 才会训练 mm_proj\n- `freeze_vision_tower: true`（默认值）—— 保持视觉塔冻结\n- `train_mm_proj_only: false`（默认值）—— 确保不是「仅训练投影器」，这样 LLM 部分通过 LoRA 一起训练\n\n配置示例：\n\n```yaml\nmodel: <Qwen2-VL 模型路径或 Hub ID>\nmodel_class: llm\ntrain_dataset: <数据集配置>\n\nfinetuning_type: lora\nfreeze_vision_tower: true            # 冻结视觉塔\nfreeze_multi_modal_projector: false  # 解冻多模态投影器（mm_proj）\ntrain_mm_proj_only: false            # 不只训练投影器，LLM 侧由 LoRA 训练\n\npeft_config:\n  name: lora\n  # LoRA 的具体字段（如 rank、target 模块等）资料里没有找到\n```\n\n说明：\n\n1. 资料中提到 `peft_config` 可以是 LoRA 或 Freeze 配置（模型参数 ModelArguments），但给出的 `peft_config` 字段明细只有 Freeze 的（`freeze_trainable_layers`、`freeze_trainable_modules`、`freeze_extra_modules`、`cast_trainable_params_to_fp32`），LoRA 的具体字段在资料里没有找到，请查阅完整的 LoRA 参数文档。\n2. 如果 LoRA 配置中有类似「额外可训练模块」的选项（如 Freeze 中的 `freeze_extra_modules`），也可以尝试把 mm_proj 相关模块加进去，但具体 LoRA 参数名资料中未给出。"}, {"code": "Q077", "qid": "40", "type": "参数类", "q": "如何取部分数据集训练", "ctx": "docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(32.33) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(24.09) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 配置训练数据集(23.98) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > 预训练数据集¶(20.55) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(17.13) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(15.99)", "ref": "使用 `max_samples` 参数：设置后，每个数据集的样本数会被截断至指定的 max_samples（默认 None，即不限制）。", "ans": "截取部分数据训练主要有两种方式：\n\n## 方法一：数据集 YAML 中的 `size` / `weight`（推荐，按数据集精细控制）\n\n在数据集 YAML 条目中设置 `size`（重采样后的目标索引数量）和 `weight`（索引数量的缩放倍率），例如：\n\n```yaml\ndemo:\n  path: organization/dataset\n  source: hf_hub\n  split: train\n  size: 1000\n  weight: 0.5\n  streaming: false\n```\n\n**计算顺序**（作用于数据集展开后的训练索引）：\n\n1. 设置 `size` 时，先从展开后的索引中**有放回**抽取 `size` 个条目；省略则保留完整索引。\n2. 设置 `weight` 时，再从上一步结果中有放回抽取 `int(当前条目数 × weight)` 个条目（小数向下取整）；省略则保留上一步结果。\n\n例如 `size: 1000` + `weight: 0.5`：先抽 1000 个，再从中抽 500 个，最终规模为 500，**可能包含重复条目，也可能未覆盖某些原始记录**。\n\n**注意事项**：\n- `weight` 控制每个数据集贡献的索引数量，不是各数据集间归一化后的抽样概率，也不改变样本的损失权重；`weight > 1` 可以增加索引数量。\n- 显式设置 `weight: 1.0` 仍会执行有放回重采样；**只有同时省略 `size` 和 `weight` 才会直接保留全部索引**。\n- 多轮 SFT 中每个受监督的 assistant turn 对应一个索引条目，索引数量可能大于原始行数；偏好对数据以一组 chosen/rejected 为一个条目。\n\n## 方法二：`max_samples` 参数（简单截断）\n\n在训练参数中设置 `max_samples`（默认 `None`）：设置后**每个数据集**的样本数将被截断至指定的 `max_samples`，适合对所有数据集统一截取的场景。\n\n另外提醒：数据集 YAML 中多个条目的 `streaming` 配置必须一致，且当前训练路径不支持 streaming 数据集。"}, {"code": "Q078", "qid": "39", "type": "操作类", "q": "如何指定只冻结 LLM 进行多模态模型的训练？", "ctx": "webdocs/advanced__tuning_algorithms.md#... > Freeze¶(33.22) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(27.6) ｜ docs/zh/configuration/model.md#模型参数 > ModelArguments(25.71) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(25.07) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > 基本参数¶(22.2) ｜ webdocs/advanced__model_support.md#模型支持¶ > 多模态数据构建¶(19.21)", "ref": "Freeze 直接更新指定层或模块的权重，其余参数保持冻结。", "ans": "根据资料，可以通过 `train_mm_proj_only` 参数实现只训练多模态部分（即冻结 LLM），它会**仅训练多模态投影器**，其余部分（LLM、视觉塔）全部冻结：\n\n```yaml\ntrain_mm_proj_only: true\n```\n\n相关的多模态冻结参数（默认值）还有：\n\n| 参数 | 默认值 | 说明 |\n|------|--------|------|\n| `freeze_vision_tower` | `true` | MLLM 训练时是否冻结视觉塔 |\n| `freeze_multi_modal_projector` | `true` | MLLM 训练时是否冻结多模态投影器 |\n| `train_mm_proj_only` | `false` | 是否仅训练多模态投影器 |\n\n补充说明：\n- 如果只是想冻结视觉塔而保留其他部分训练，`freeze_vision_tower` 默认即为 `true`，无需额外设置。\n- 资料「仅冻结 LLM、但训练视觉塔」这种组合没有直接给出对应的参数说明。"}, {"code": "Q079", "qid": "59", "type": "补充类", "q": "请教下在 finetuning_type 为 full 的情况下，冻结参数的设置会生效吗？", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > Freeze¶(32.93) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶ > method(29.48) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(25.54) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > 基本参数¶(23.82) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶(22.97) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(22.32)", "ref": "Freeze 是独立的微调方法（`finetuning_type: freeze`），直接更新指定层或模块的权重、其余参数保持冻结；文档未说明 finetuning_type 为 full 时该配置是否生效。", "ans": "资料里没有找到。"}, {"code": "Q080", "qid": "51", "type": "操作类", "q": "如何从checkpoints 完整复原出 optimizer,model 等的训练时的状态，使其可以从中断点继续训练", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(47.26) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(41.7) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(36.67) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 仅保存模型权重¶(23.63) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(20.23) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(19.41)", "ref": "设置 `resume_from_checkpoint` 指向 checkpoint 路径（或 `auto`），即可恢复训练状态；该字段默认 None。", "ans": "可以从以下几个方面操作，实现从 checkpoint 完整恢复训练状态：\n\n## 1. 确保保存的 checkpoint 包含完整训练状态\n\n- **不要开启** `save_only_model: true`。该选项只保存模型权重、不保存 optimizer、scheduler 等训练状态，会导致无法完整续训。\n- 对于 FSDP2 / FSDPTurbo / DeepSpeed 等后端，默认保存的 checkpoint 本身就是用于续训的训练状态（分布式 checkpoint / DeepSpeed 训练状态）；`save_ckpt_as_hf: true` 只是在 checkpoint 中额外生成 `hf_model` 目录，原始续训 checkpoint 仍会保留。\n\n保存频率相关配置（训练 YAML 顶层）：\n\n```yaml\nsave_steps: 500\nsave_epochs: null\nsave_total_limit: 3\nsave_ckpt_as_hf: false\n```\n\n## 2. 使用 `resume_from_checkpoint` 恢复训练\n\n**方式一：指定具体 checkpoint 目录**（推荐）\n\n```yaml\noutput_dir: saves/qwen3_8b_lora_sft\nresume_from_checkpoint: saves/qwen3_8b_lora_sft/checkpoint-1000\n```\n\n**方式二：自动查找**\n\n```yaml\nresume_from_checkpoint: auto\n```\n\n`auto` 会在当前 `output_dir` 下寻找最新的**完整** checkpoint。\n\n## 3. 恢复的内容\n\n设置 `resume_from_checkpoint` 后，Trainer 在初始化阶段会加载：\n\n- 模型参数\n- 优化器状态\n- 学习率调度器\n- 批次进度、训练步数\n- 可用的随机数状态\n\n## 注意事项\n\n1. **不设置 `resume_from_checkpoint` 时，即使 `output_dir` 中存在 checkpoint，也不会触发续训。**\n2. 如果之前开启了 `save_only_model: true`，由于缺少 optimizer、scheduler 等状态，无法进行完整的断点续训，此时保存结果更适合用于推理、评估或权重转换。\n3. `save_total_limit` 会删除最旧的完整 checkpoint，注意保留你想要恢复的那个。"}, {"code": "Q081", "qid": "30", "type": "参数类", "q": "--cutoff_len 1024，截断长度设置的 1024，是指 1024 个字，还是 1024 个 token？", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(15.02) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(12.7) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(10.23) ｜ docs/zh/feature-guide/batching.md#批处理策略(10.15) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 模型导出¶(6.32) ｜ docs/zh/feature-guide/batching.md#批处理策略 > 配置示例(6.27)", "ref": "是 token。cutoff_len 的定义是「输入的最大 token 数，超过该长度会被截断」，默认值 2048。", "ans": "在参数 `cutoff_len` 中，1024 表示的是 1024 个 token，而不是 1024 个字。这个参数定义了输入的最大 token 数，超过该长度的内容会被截断。"}, {"code": "Q082", "qid": "56", "type": "参数类", "q": "video_maxlen 和 cutoff_len 分别是什么含义？", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 多模态模型¶(15.1) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(11.28) ｜ docs/zh/configuration/data.md#数据参数 > DataArguments(7.88) ｜ examples/train_lora/mossvl_lora_sft.yaml#examples/train_lora/mossvl_lora_sft.yaml(5.79) ｜ examples/train_full/mossvl_full_sft.yaml#examples/train_full/mossvl_full_sft.yaml(5.79) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(5.62)", "ref": "video_maxlen 是视频输入的最大采样帧数，默认 128；cutoff_len 是输入的最大 token 数，超过会被截断，默认 2048。", "ans": "video_maxlen 是视频输入的最大采样帧数，用于控制视频输入时的帧数限制。而 cutoff_len 是最大序列长度，用于控制模型处理输入序列的最大长度。"}, {"code": "Q083", "qid": "19", "type": "补充类", "q": "昇腾多机训练怎么设置？", "ctx": "docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.98) ｜ README_zh.md#克隆 bitsandbytes 仓库, Ascend NPU 目前在 multi(23.38) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(21.81) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(21.74) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练(21.27) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(21.17)", "ref": "通过环境变量 `ASCEND_RT_VISIBLE_DEVICES` 选择要使用的 NPU 设备。", "ans": "根据现有资料，没有找到昇腾 NPU 专属的多机训练配置说明，但可以提供以下相关信息：\n\n**1. 多机启动的通用配置（同样适用于各后端）**\n\nCLI 通过环境变量读取拓扑信息，多机时在每台机器上执行，例如 4 台机器、每台 8 卡：\n\n```bash\nNNODES=4 \\\nNODE_RANK=<0到3，各节点不同> \\\nNPROC_PER_NODE=8 \\\nMASTER_ADDR=<rank 0 节点的 IP> \\\nMASTER_PORT=29500 \\\nllamafactory-cli sft config.yaml\n```\n\n注意：所有节点需使用相同的 `NNODES`、`NPROC_PER_NODE`、`MASTER_ADDR` 和 `MASTER_PORT`，仅 `NODE_RANK` 分别设为 0、1、2、3。\n\n**2. 昇腾相关提示**\n\n- 训练命令检测到多设备后会自动通过 `torchrun` 启动；拓扑字段属于 `TrainingArguments`，后端专属字段放在 `dist_config`。\n- NPU 的设备安装与支持范围，文档指引参见 `docs/zh/multi-backend/npu/index.md`（该页面的具体内容在提供的资料中没有，无法给出细节）。\n- 若需使用 bitsandbytes，昇腾 NPU 目前在 `multi-backend-refactor` 分支中支持：\n\n```bash\ngit clone -b multi-backend-refactor https://github.com/bitsandbytes-foundation/bitsandbytes.git\ncd bitsandbytes/\n```\n\n如需 NPU 专属的多机设置细节（如 `dist_config` 中 NPU 后端字段、HCCL 相关配置等），资料里没有找到，建议查阅上述 NPU 说明文档。"}, {"code": "Q084", "qid": "28", "type": "补充类", "q": "如何设置模型推理的一些参数如 temperature？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(30.7) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(30.15) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(24.94) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(23.63) ｜ examples/README_zh.md#目录 > 示例 > 推理 LoRA 模型 > 使用 vLLM 多卡推理评估(19.82) ｜ docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(19.02)", "ref": "通过 `temperature` 参数设置：用于调整生成文本的随机性，默认值 0.95；temperature 越高生成越随机，越低越确定。", "ans": "资料里没有找到。"}, {"code": "Q085", "qid": "29", "type": "操作类", "q": "请问使用全参训练出的checkpoint如何与原始模型的权重进行合并？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(32.84) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(31.25) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(29.45) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > 全参训练(28.92) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(28.87) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(28.48)", "ref": "您可以通过 `llamafactory-cli exportmerge_config.yaml` 指令来合并模型。其中 `merge_config.yaml` 需要您根据不同情况进行配置。", "ans": "**全参训练产生的 checkpoint 不需要（也不存在）与原始模型权重合并的步骤。**\n\n根据资料说明：\n\n1. **全参训练的输出本身就是完整模型权重。** 全参训练会更新全部模型参数（不设置 `peft_config`），训练输出目录（如 `outputs/qwen3_full`）中已包含完整的模型权重。因此无需像 LoRA 那样进行合并操作。\n\n2. **直接加载使用即可。** 完成全参 SFT 后，只需将 `chat.yaml` 中的 `model` 改为训练输出目录（如 `outputs/qwen3_full`），加载时**移除此前的 `peft_config`**，保留采样参数，然后运行：\n   ```bash\n   llamafactory-cli chat chat.yaml\n   ```\n\n3. **资料中的“合并（export）”流程仅适用于 LoRA 适配器**，即需要将 `adapter_name_or_path` 指定的适配器合并回基座模型的场景。全参训练没有独立的适配器文件，自然不涉及这一步。\n\n补充说明：资料里没有找到关于“将全参 checkpoint 与原始模型权重合并”的具体操作方法，因为从训练机制上讲，全参 checkpoint 已经是独立、完整的模型，可直接用于推理或后续导出量化等流程。"}, {"code": "Q086", "qid": "19", "type": "补充类", "q": "昇腾多机训练怎么设置？", "ctx": "docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.98) ｜ README_zh.md#克隆 bitsandbytes 仓库, Ascend NPU 目前在 multi(23.38) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(21.81) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(21.74) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练(21.27) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(21.17)", "ref": "通过环境变量 `ASCEND_RT_VISIBLE_DEVICES` 选择要使用的 NPU 设备。", "ans": "资料里没有找到。"}, {"code": "Q087", "qid": "9", "type": "参数类", "q": "UserWarning('`do_sample` is set to `False`. However, `temperature` is set to `0.9` -- this flag is only used in sample-based generation modes. You should set `do_sample=True` or unset `temperature`.'), UserWarning('`do_sample` is set to `False`. However, `top_p` is set to `0.6` -- this flag is only used in sample-based generation modes. You should set `do_sample=True` or unset `top_p`.')]", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(55.45) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(9.49) ｜ README_zh.md#编译 & 安装(7.95) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(6.68) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (6.48) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 多模态模型¶(6.16)", "ref": "`do_sample` 设置为 False 时，将使用 greedy decoding（贪心解码）生成文本，不再进行采样。", "ans": "这些警告信息表明在使用 `do_sample=False` 时，`temperature` 和 `top_p` 参数被设置为非默认值，但 `do_sample=False` 仅用于 greedy decoding 模式，而 `temperature` 和 `top_p` 是用于采样策略的参数。因此，当 `do_sample=False` 时，不应设置 `temperature` 和 `top_p`。正确的做法是设置 `do_sample=True` 或者将 `temperature` 和 `top_p` 设为默认值。"}, {"code": "Q088", "qid": "12", "type": "参数类", "q": "我想接着checkpoint继续train 该怎么办呢", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(54.89) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(44.89) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > Checkpoint 与日(35.75) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(33.79) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(33.79) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (32.74)", "ref": "设置 `resume_from_checkpoint: auto` 并在 `output_dir` 下寻找最新的完整 checkpoint。", "ans": "你可以通过设置 `resume_from_checkpoint` 参数来从现有的 checkpoint 继续训练。如果希望从 `output_dir` 中最新的完整 checkpoint 恢复训练状态，可以使用以下配置：\n\n```yaml\nresume_from_checkpoint: auto\n```\n\n这会自动在 `output_dir` 下寻找最新的完整 checkpoint，从而恢复训练状态。如果需要指定具体的 checkpoint 路径，可以直接填写 checkpoint 路径。例如：\n\n```yaml\nresume_from_checkpoint: saves/qwen3_8b_lora_sft/checkpoint-1000\n```\n\n此外，确保 `save_strategy` 和 `save_steps` 等参数已正确配置，以保证 checkpoint 的保存策略符合你的需求。如果之前开启了 `save_only_model:true`，则可能无法进行完整的断点续训，此时更适合将保存结果用于推理、评估或后续权重转换。"}, {"code": "Q089", "qid": "52", "type": "操作类", "q": "qwen2vl 7b , how to call api", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(38.55) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API(34.2) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(17.77) ｜ webdocs/getting_started__inference.md#推理¶(16.38) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(14.71) ｜ README_zh.md#A3 + openEuler > 利用 vLLM 部署 OpenAI API >(14.21)", "ref": "您可以使用 `llamafactory-clichatinference_config.yaml` 或 `llamafactory-cliwebchatinference_config.yaml` 进行推理与模型对话。", "ans": "以下是基于资料整理的调用方式（资料中没有 qwen2vl 的专属示例配置，以下为按通用方法推导的步骤）：\n\n**1. 编写推理配置文件**（如 `examples/inference/qwen2vl.yaml`）\n\n参考 qwen3 的示例格式：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen2-VL-7B-Instruct   # 或本地模型路径\ntemplate: <与模型对应的模板>   # 资料中未列出 qwen2vl 的具体模板名\ntrust_remote_code: true\n```\n\n注意：资料中提到「使用任何方式推理时，模型 `model_name_or_path` 需要存在且与 `template` 相对应」，请确保 template 与 qwen2vl 匹配。\n\n如果是微调过的模型，还需添加（参考 qwen3_lora_sft.yaml 示例）：\n\n```yaml\nadapter_name_or_path: saves/qwen2vl-7b/lora/sft\nfinetuning_type: lora\n```\n\n**2. 启动 API 服务**\n\n默认 Huggingface 引擎：\n\n```bash\nAPI_PORT=8000 CUDA_VISIBLE_DEVICES=0 llamafactory-cli api examples/inference/qwen2vl.yaml\n```\n\n或使用 vLLM 加速：\n\n```bash\nAPI_PORT=8000 llamafactory-cli api examples/inference/qwen2vl.yaml infer_backend=vllm vllm_enforce_eager=true\n```\n\n**3. 调用 API**\n\n启动后服务兼容 OpenAI API 格式，文档见：https://platform.openai.com/docs/api-reference/chat/create\n\n由于 qwen2vl 是多模态模型，图像理解可参考示例脚本：`scripts/api_example/test_image.py`（工具调用示例为 `scripts/api_example/test_toolcall.py`）。\n\n**说明**：资料中没有找到 qwen2vl 专用的 template 名称及完整的图像输入调用示例代码，具体 template 取值请查阅 LlamaFactory 支持的模板列表或官方仓库示例目录 `examples/inference/` 下的相关配置。"}, {"code": "Q090", "qid": "5", "type": "参数类", "q": "多机多卡，设置 data_shared_file_system 为 true 时每个 worker 都要算一遍 tokenize", "ctx": "webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(29.15) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(27.26) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(25.11) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(24.45) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.24) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (23.95)", "ref": "文档说明相反：data_shared_file_system 为 true 时数据集处理只在第一个 node 发生，为 false 时每个 node 都处理一次，默认 false。若出现每个 worker 都 tokenize，应检查该值是否被设为 false。", "ans": "当设置 `data_shared_file_system` 为 true 时，不同机器存放数据集的路径是共享文件系统。在这种情况下，数据集处理只在第一个 node 发生，而不是每个 node 都处理一遍。因此，每个 worker 并不会都算一遍 tokenize。如果希望每个 worker 都算一遍 tokenize，需要将 `data_shared_file_system` 设置为 false。"}, {"code": "Q091", "qid": "11", "type": "参数类", "q": "推理可以直接设置do_sample=False的贪心采样策略吗", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(27.02) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(20.41) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(20.3) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(19.92) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(14.74) ｜ docs/zh/configuration/inference.md#推理参数 > SampleArguments(14.67)", "ref": "可以直接设置do_sample=False的贪心采样策略。", "ans": "是的，推理可以直接设置 `do_sample=False` 的贪心采样策略。在生成参数中，`do_sample` 参数用于控制是否使用采样策略生成文本，若设置为 `False`，则会使用 greedy decoding（贪心解码）策略。这一参数在推理过程中是可以直接设置的。"}, {"code": "Q092", "qid": "57", "type": "操作类", "q": "新手发问：SFT只有部分assistant的内容计算loss，该如何实现 —— ### Discussed in https://github.com/hiyouga/LLaMA-Factory/discussions/6389      Originally posted by **ReycoLi** December 19, 2024  数据集的格式如下  \"message", "ctx": "docs/zh/feature-guide/data_preparation.md#数据准备 > SFT 数据格式(35.61) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo > 采样规模的计算(26.4) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(25.74) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (23.43) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶ > OpenAI格式¶(21.62) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 配置字段¶ > 重计算与融合¶(19.62)", "ref": "多轮对话会按每个受监督的 assistant turn 展开为多条训练样本，每条样本只监督最后一个 assistant turn。", "ans": "在 SFT 数据里，可以通过给 assistant turn 设置 **`loss_weight`** 字段来控制该轮回复是否/以多大权重参与损失计算。具体规则（来自数据准备文档）：\n\n- `loss_weight` 是该 assistant turn 的监督权重，会应用到该回复的**每个监督 token** 上；\n- `0.0`：不参与损失计算；\n- `1.0`：使用完整权重；\n- 也可以设置 `0.5` 等中间值，调整不同回复之间的相对权重。\n\n示例格式：\n\n```json\n{\n  \"messages\": [\n    {\n      \"role\": \"user\",\n      \"content\": [{\"type\": \"text\", \"value\": \"介绍一下你自己。\"}],\n      \"loss_weight\": 0.0\n    },\n    {\n      \"role\": \"assistant\",\n      \"content\": [{\"type\": \"text\", \"value\": \"我是一个 AI 助手。\"}],\n      \"loss_weight\": 1.0\n    }\n  ]\n}\n```\n\n补充说明：\n\n1. `content` 是内容块列表，文本用 `{\"type\": \"text\", \"value\": \"...\"}`；多模态内容可用 `image_url`、`audio_url` 或 `video_url`。\n2. 多轮对话会按每个受监督的 assistant turn 展开为多条训练样本，每条样本只监督最后一个 assistant turn。因此如果想跳过某几轮、只训练特定轮次，把不想训练的 assistant turn 的 `loss_weight` 设为 `0.0` 即可。\n\n另外，如果你是想让 prompt 部分也参与/不参与训练，还可以配合 `train_on_prompt`（默认 `False`，即默认不在 prompt 上计算损失）这一训练参数使用；但针对「只让部分 assistant 内容算 loss」的需求，直接用 `loss_weight` 就可以实现。\n\n资料里没有找到的内容（例如更早版本的 ShareGPT 格式下如何实现该功能）不在本资料范围内，无法展开说明。"}, {"code": "Q093", "qid": "33", "type": "操作类", "q": "调用api_demo的时候如何能切换多个微调后的lora模型 —— 目前是这样运行 但只能加载固定一个lora模型，    api调用的时候可以通过model参数切换lora模型吗", "ctx": "docs/zh/feature-guide/model_export.md#模型导出 > 合并多个 Adapter(38.47) ｜ docs/zh/feature-guide/inference.md#推理 > 使用 LoRA Adapter(36.06) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > LoRA(33.62) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > LoRA¶(27.39) ｜ docs/zh/feature-guide/model_export.md#模型导出(26.9) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > model(26.82)", "ref": "通过 `peft_config.adapter_name_or_path` 指定 adapter。", "ans": "**资料里没有找到**关于 `api_demo` / API 服务中通过 `model` 参数动态切换 LoRA 模型的说明，资料未提及 API 请求级别切换 adapter 的功能。\n\n基于现有资料，可以给你两个相关的替代思路：\n\n**思路一：分别合并导出为多个完整模型，再分别部署**\n\n资料 5 提到 `merge` 命令可将 LoRA adapter 合并到基座模型并保存为 Hugging Face 格式目录。你可以对每个 adapter 各执行一次合并，得到多个独立的模型目录，然后为每个目录启动服务。参考配置（资料 6 的示例）：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\nadapter_name_or_path: saves/qwen3-4b/lora/sft\ntemplate: qwen3_nothink\ntrust_remote_code: true\n```\n\n**思路二：多个 adapter 按顺序合并到一个模型**\n\n资料 1、2 表明 `adapter_name_or_path` 支持列表，推理/导出时会按顺序依次合并：\n\n```yaml\npeft_config:\n  name: lora\n  adapter_name_or_path:\n    - outputs/domain_adapter\n    - outputs/task_adapter\n```\n\n注意这是**依次叠加合并**，而不是\"多选一\"的切换。\n\n**总结**：如果资料范围之外的情况——比如 LLaMA-Factory 实际是否支持在 API 请求的 `model` 字段中指定 adapter 路径——建议查阅官方 API 文档或源码确认，当前资料无法证实该功能存在。"}, {"code": "Q094", "qid": "44", "type": "参数类", "q": "Support Liger Kernel for Qwen3.5", "ctx": "docs/zh/feature-guide/kernel_acceleration.md#融合算子加速 > Liger Kernel(32.67) ｜ webdocs/advanced__acceleration.md#加速¶ > Liger Kernel¶(26.74) ｜ docs/zh/configuration/model.md#模型参数 > kernel_config(9.13) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速(8.41) ｜ examples/extras/fp8/llama3_fp8_fsdp_sft.yaml#examples/extras/fp8/llama3_fp8_fsdp_sft.(6.53) ｜ docs/zh/feature-guide/kernel_acceleration.md#融合算子加速 > 自动配置(4.97)", "ref": "通过 `kernel_config` 统一配置模型侧的融合算子加速（如 Liger Kernel）。`kernel_config.name` 接受加速实现名称，也可用逗号分隔多个；未设置或设为 null 时不做算子替换。", "ans": "关于 **Qwen3.5 是否支持 Liger Kernel**，资料里没有找到针对 Qwen3.5 的明确说明。\n\n资料中与此相关的通用信息如下：\n\n1. **Liger Kernel 需要模型具有对应适配**：它根据模型类型调用 `liger_kernel.transformers` 中对应的应用函数（可融合 RMSNorm、RoPE、SwiGLU、Cross Entropy 等），**具体启用项由模型支持范围和 Liger Kernel 版本决定**（资料 1）。因此某个具体模型（如 Qwen3.5）能否使用，取决于该模型是否在所用 `liger-kernel` 版本的适配范围内，资料无法直接确认。\n\n2. **启用方式**（两种写法，来自不同文档）：\n   - 新配置入口：\n     ```yaml\n     kernel_config:\n       name: liger_kernel\n     ```\n   - 训练配置参数：\n     ```yaml\n     enable_liger_kernel: True\n     ```\n\n3. **自动配置不会默认启用**：`kernel_config.name: auto` 时仅 NPU 配置了默认组合，**CUDA 上不会自动启用 Liger Kernel**，需要显式配置。\n\n如需确认 Qwen3.5 的适配情况，建议查看所用 `liger-kernel` 版本的模型支持列表，资料中未包含该信息。"}, {"code": "Q095", "qid": "42", "type": "补充类", "q": "如何在 sft llama 时添加 special token？", "ctx": "webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > Supervised Fine(26.47) ｜ webdocs/advanced__extras.md#额外选项¶ > LLaMA Pro¶(13.45) ｜ webdocs/advanced__tuning_algorithms.md#调优算法¶ > Full Parameter Fine-tuning¶(11.33) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 基本参数¶(11.08) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > SFT 数据格式(9.84) ｜ webdocs/advanced__acceleration.md#加速¶ > Unsloth¶(7.97)", "ref": "使用 `new_special_tokens` 参数：要添加到 tokenizer 中的 special token，多个用逗号分隔，默认值为 None。", "ans": "在进行监督微调（SFT）时，如果需要添加 special token，您可以使用 `new_special_tokens` 参数。该参数用于指定要添加到 tokenizer 中的 special token，多个 special token 用逗号分隔。\n\n例如，如果您想添加两个 special token，可以这样设置：\n\n```\nnew_special_tokens: \"token1,token2\"\n```\n\n请确保在训练配置中正确设置此参数，以便在微调过程中使用这些 special token。"}, {"code": "Q096", "qid": "14", "type": "参数类", "q": "从 huggingface 中加载数据集时始终为 split=train，怎么指定其他 split？", "ctx": "docs/zh/configuration/data.md#数据参数 > DatasetInfo(16.52) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(15.7) ｜ examples/README_zh.md#目录 > 示例 > LoRA 微调 > 预处理数据集(14.55) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 组合多个数据集(14.43) ｜ README_zh.md#编译 & 安装 > 数据准备(14.27) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > 配置训练数据集(14.22)", "ref": "在数据集 YAML 的顶层条目里显式设置 `split` 字段。该字段默认值为 train，类型为 str。", "ans": "可以通过数据集 YAML 中的 `split` 字段指定，该字段默认值为 `train`，可改为其他 split（如 `validation`、`test`）。\n\n**示例**（数据集 YAML）：\n\n```yaml\ndemo:\n  path: organization/dataset\n  source: hf_hub\n  split: validation   # 指定所需的 split，默认为 train\n```\n\n然后在训练 YAML 的 `train_dataset` 中指向这个数据集 YAML，例如 `train_dataset: data/v1_sft_demo.yaml`。\n\n**注意事项**：\n- 同一个 YAML 中的 `streaming` 配置必须一致，且当前训练路径不支持 streaming 数据集。\n- 如果直接给 `train_dataset` 传 Hub 数据集 ID（而非 YAML），资料中未说明此时如何指定 split，因此建议使用上述数据集 YAML 的方式。"}, {"code": "Q097", "qid": "37", "type": "参数类", "q": "freeze_trainable_layers 这个参数是什么含义？", "ctx": "webdocs/advanced__tuning_algorithms.md#... > Freeze¶(31.48) ｜ webdocs/advanced__tuning_algorithms.md#... > Freeze¶ > method(24.85) ｜ docs/zh/configuration/model.md#模型参数 > peft_config > Freeze(24.29) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > Freeze¶(22.29) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > Freeze(21.76) ｜ docs/zh/quick_start.md#快速开始 > 文档导航(10.43)", "ref": "可训练层的数量：正数表示最后 n 层被设置为可训练的，负数表示前 n 层被设置为可训练的，默认值为 2。", "ans": "`freeze_trainable_layers` 是 **Freeze（冻结微调）** 中的参数，用于指定可训练层的数量。\n\n- **类型**：int\n- **默认值**：2\n- **含义**：\n  - **正数**：表示模型**最后 n 层**被设置为可训练；\n  - **负数**：表示模型**最前 n 层**被设置为可训练。\n\n使用时需将 `finetuning_type` 设置为 `freeze`，例如：\n\n```yaml\nstage: sft\ndo_train: true\nfinetuning_type: freeze\nfreeze_trainable_layers: 8\nfreeze_trainable_modules: all\n```\n\n在新版配置格式中，对应 `peft_config` 里的 `name: freeze` 下的 `freeze_trainable_layers` 字段，含义相同（正数选最后 N 层，负数选最前 N 层）。"}, {"code": "Q098", "qid": "6", "type": "操作类", "q": "如何对多轮对话数据进行批量推理？数据集格式规范", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > 数据集¶(33.99) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(31.09) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶ > OpenAI格式¶(30.54) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶ > 偏好数据集¶(30.16) ｜ docs/zh/feature-guide/inference.md#推理(26.59) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶ > 指令监督微调数据集¶(26.03)", "ref": "您可以通过以下指令启动 vllm 推理引擎并使用数据集进行批量推理：\n\npython scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo", "ans": "## 批量推理方法\n\n根据资料，可以通过 vllm 推理引擎使用数据集进行批量推理：\n\n```bash\npython scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo\n```\n\n其中 `--dataset` 指定数据集名称（需在 `dataset_info.json` 中注册）。\n\n## 多轮对话数据集格式规范\n\n多轮对话数据属于 **sharegpt** 格式，有两种写法：\n\n### 方式一：OpenAI 格式（sharegpt 的特殊情况）\n\n第一条消息可以是系统提示词，消息按 `role` / `content` 组织：\n\n```json\n[\n  {\n    \"messages\": [\n      {\n        \"role\": \"system\",\n        \"content\": \"系统提示词（选填）\"\n      },\n      {\n        \"role\": \"user\",\n        \"content\": \"人类指令\"\n      },\n      {\n        \"role\": \"assistant\",\n        \"content\": \"模型回答\"\n      }\n    ]\n  }\n]\n```\n\n对应的 `dataset_info.json` 描述：\n\n```json\n\"dataset_name\": {\n  \"file_name\": \"data.json\",\n  \"formatting\": \"sharegpt\",\n  \"columns\": {\n    \"messages\": \"messages\"\n  },\n  \"tags\": {\n    \"role_tag\": \"role\",\n    \"content_tag\": \"content\",\n    \"user_tag\": \"user\",\n    \"assistant_tag\": \"assistant\",\n    \"system_tag\": \"system\"\n  }\n}\n```\n\n### 方式二：ShareGPT 格式（`from` / `value` 组织）\n\n```json\n[\n  {\n    \"conversations\": [\n      {\n        \"from\": \"human\",\n        \"value\": \"人类指令\"\n      },\n      {\n        \"from\": \"function_call\",\n        \"value\": \"工具参数\"\n      },\n      {\n        \"from\": \"observation\",\n        \"value\": \"工具结果\"\n      },\n      {\n        \"from\": \"gpt\",\n        \"value\": \"模型回答\"\n      }\n    ],\n    \"system\": \"系统提示词（选填）\",\n    \"tools\": \"工具描述（选填）\"\n  }\n]\n```\n\n对应的 `dataset_info.json` 描述：\n\n```json\n\"dataset_name\": {\n  \"file_name\": \"data.json\",\n  \"formatting\": \"sharegpt\",\n  \"columns\": {\n    \"messages\": \"conversations\",\n    \"system\": \"system\",\n    \"tools\": \"tools\"\n  }\n}\n```\n\n**位置要求**：`human` 和 `observation` 必须出现在奇数位置，`gpt` 和 `function` 必须出现在偶数位置。\n\n## 补充说明\n\n- 如果想通过 API 服务调用，也可以使用类似 `API_PORT=8000 CUDA_VISIBLE_DEVICES=0 llamafactory-cli api examples/inference/qwen3_lora_sft.yaml` 的方式启动服务（yaml 中可配置 `model_name_or_path`、`adapter_name_or_path`、`template` 等）。\n- 资料 5 提到 v1 的 `chat` 入口目前仅支持 `sample_backend: hf` 的交互式单条推理，批量推理和 `vllm` 采样后端尚未接入该入口。"}, {"code": "Q099", "qid": "25", "type": "操作类", "q": "qwen2vl-sft后如何将adapter_model.safetensors和模型原始参数合并使用", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 仅保存模型权重¶(36.47) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(36.09) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(35.24) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > model(34.9) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > model(33.76) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(33.16)", "ref": "您可以通过 `llamafactory-cli export merge_config.yaml` 指令来合并模型。", "ans": "合并 LoRA 适配器使用 `export` 导出，参考配置如下（资料中以 Qwen3 为例，qwen2vl 同理，只需换成对应的模型路径和 template）：\n\n```yaml\n### model\nmodel_name_or_path: 原始模型路径          # 微调时使用的未量化基座模型\nadapter_name_or_path: saves/qwen2vl/lora/sft   # 与 SFT 时的 output_dir 一致，即 adapter_model.safetensors 所在目录\ntemplate: 与模型对应的 template\ntrust_remote_code: true\n\n### export\nexport_dir: saves/qwen2vl_sft_merged\nexport_size: 5\nexport_device: cpu\nexport_legacy_format: false\n```\n\n要点说明：\n\n1.
