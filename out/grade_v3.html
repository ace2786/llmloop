**adapter_name_or_path 不是指向 adapter_model.safetensors 文件本身**，而是指向微调时的适配器输出目录 `output_dir`（资料备注：`adapter_name_or_path` 需要与微调中的适配器输出路径 `output_dir` 相对应）。\n2. `model_name_or_path` 需要存在且与 `template` 相对应。qwen2vl 对应的具体 template 名称在资料里没有找到，请以模型实际对应的 template 为准。\n3. **合并时不要使用量化模型或指定量化位数**（如 `quantization_bit`），应使用本地或下载的未量化预训练模型进行合并。\n4. 合并完成后，完整权重会保存在 `export_dir` 指定的目录中（如 `saves/qwen2vl_sft_merged`），之后可直接加载该目录用于推理。\n\n另外补充一点与保存相关的信息：如果训练时只关心最终导出权重，可设置 `save_only_model: true` 减少磁盘占用，但这样缺少训练状态，无法用于中途恢复训练。"}, {"code": "Q100", "qid": "17", "type": "参数类", "q": "支持Qwen3-4B-Instruct-2507的KTO训练吗", "ctx": "webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > KTO¶(14.02) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > Alpaca¶ > KTO 数据集¶(11.81) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > llamafactor(9.39) ｜ examples/train_lora/qwen3_lora_kto.yaml#examples/train_lora/qwen3_lora_kto.yaml(8.9) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶(5.21) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > RLHF¶(3.99)", "ref": "支持", "ans": "支持。资料中提供了官方示例配置 `examples/train_lora/qwen3_lora_kto.yaml`，正是使用 `Qwen/Qwen3-4B-Instruct-2507` 进行 KTO 训练的 LoRA 微调示例。\n\n关键配置片段：\n\n```yaml\n### model\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntrust_remote_code: true\n\n### method\nstage: kto\ndo_train: true\nfinetuning_type: lora\nlora_rank: 8\nlora_target: all\npref_beta: 0.1\n\n### dataset\ndataset: kto_en_demo\ntemplate: qwen3_nothink\ncutoff_len: 2048\n\n### output\noutput_dir: saves/qwen3-4b/lora/kto\n```\n\n启动方式（可参考 NativeDDP 的启动命令格式）：\n\n```bash\nFORCE_TORCHRUN=1 llamafactory-cli train examples/train_lora/qwen3_lora_kto.yaml\n```\n\n注意两点：\n\n1. **数据集格式**：KTO 训练需要使用 KTO 数据集，即每条数据包含 `instruction`、`input`（选填）、`output` 以及表示人类反馈的 `kto_tag`（true/false）列。\n2. **相关参数**：可根据需要调整 KTO 相关参数，如 `pref_beta`（默认 0.1）、`kto_chosen_weight`（默认 1.0）、`kto_rejected_weight`（默认 1.0）。"}, {"code": "Q101", "qid": "4", "type": "参数类", "q": "为什么 yaml中设置的lora_rank和adapter config文件的lora_rank有2倍的关系，以哪个为准？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(14.86) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > LoRA¶(13.26) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > method(12.92) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > rsLoRA¶(9.15) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (8.74) ｜ webdocs/advanced__tuning_algorithms.md#... > LoRA¶ > method(8.0)", "ref": "文档中 lora_alpha（LoRA 缩放系数）一般为 lora_rank * 2，你看到的 2 倍关系很可能来自 lora_alpha 与 lora_rank 的这个关系；文档未说明两处 lora_rank 不一致时以哪个为准。", "ans": "资料里没有找到关于「yaml 中的 `lora_rank` 与 adapter config 文件中的 `lora_rank` 存在 2 倍关系」的说明，无法解释这个现象的成因，也无法确认应以哪个为准。\n\n资料中唯一涉及「2 倍」的内容是关于 `lora_alpha` 的：\n\n- `lora_alpha` 是 LoRA 缩放系数，**一般情况下为 `lora_rank * 2`**（默认值为 None）。\n\n如果您看到的 2 倍关系实际是指 `lora_alpha` 与 `lora_rank`（例如资料示例中的 `lora_rank: 8` 搭配 `lora_alpha: 16`），那么这是两个不同的参数：`lora_rank` 是 LoRA 的本征维数 r，`lora_alpha` 是缩放系数，二者按惯例满足 alpha ≈ 2 × rank 即可，并不是同一个参数被放大了 2 倍。\n\n另外补充一点资料中相关信息：如果使用 Megatron Bridge，`lora_rank` / `lora_alpha` 会分别映射到 Megatron LoRA 的 `dim` / `alpha`，且自定义 `lora_target` 会被忽略、`lora_dropout` 不会传入。\n\n建议您确认一下对比的是否为 `lora_rank` 与 `lora_alpha`；若确实发现 adapter config 中 `lora_rank` 与 yaml 设置不一致，资料中没有对应说明，可到 LlamaFactory 社区进一步确认。"}, {"code": "Q103", "qid": "34", "type": "操作类", "q": "deepspeed 单机多卡sft时，如何只保存模型", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 仅保存模型权重¶(43.34) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(41.58) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(39.98) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > Checkpoint 保存(38.33) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(36.91) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(36.27)", "ref": "设置 `save_only_model: true`，deepspeed 训练时同样只保存模型权重。", "ans": "在使用 DeepSpeed 进行单机多卡 SFT 时，若希望只保存模型权重而不保存 optimizer、scheduler 等训练状态，可以在配置文件中设置 `save_only_model: true`。这样可以减少磁盘占用，但不适合需要中途恢复训练的场景。\n\n示例配置片段：\n```\nsave_only_model: true\n```\n\n此配置会仅保存模型权重，而不保存 optimizer、scheduler 等训练状态文件。需要注意的是，这样做后，后续一般无法进行严格意义上的完整 resume。"}, {"code": "Q104", "qid": "22", "type": "操作类", "q": "vllm如何进行batch推理", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(39.49) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(32.4) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(31.44) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > 数据集¶(31.31) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(26.8) ｜ webdocs/getting_started__inference.md#推理¶(23.95)", "ref": "通过在指令 `python scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo` 中指定模型、数据集以使用 vllm 推理框架以取得更快的推理速度。", "ans": "使用vllm进行批量推理，您可以按照以下指令启动vllm推理引擎并使用数据集进行推理：\n\n```\npython scripts/vllm_infer.py --model_name_or_path path_to_merged_model --dataset alpaca_en_demo\n```\n\n其中，`path_to_merged_model`是您本地存储的合并后的模型路径，`alpaca_en_demo`是您希望使用的数据集名称。请根据您的具体需求调整参数。"}, {"code": "Q105", "qid": "2", "type": "操作类", "q": "export model以后如何加载微调后的llama模型？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(35.0) ｜ docs/zh/feature-guide/model_export.md#模型导出(32.49) ｜ docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(31.89) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(29.78) ｜ docs/zh/feature-guide/model_export.md#模型导出 > 导出配置(29.09) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(27.72)", "ref": "将 `chat.yaml` 中的 `model` 改为 `outputs/qwen3_full`；完成[模型导出示例](model_export.md#导出配置)后，改为 `outputs/qwen3_merged`。这两种目录都包含完整模型权重，加载时移除此前的 `peft_config`，保留采样参数并运行 `llamafactory-cli chat chat.yaml`。", "ans": "导出（合并）完成后，导出目录（即 `export_dir`，例如 `outputs/qwen3_merged` 或 `saves/qwen3_sft_merged`）里已经是包含完整权重的模型，加载方式如下：\n\n1. **修改推理配置**：在推理配置文件（如 `chat.yaml`）中，把 `model` 改为导出目录路径，例如：\n\n```yaml\nmodel: outputs/qwen3_merged   # 改为你的 export_dir\ntemplate: ...                 # 与模型对应的 template\n# 采样参数保留\n```\n\n2. **移除 `peft_config`**：因为合并后的目录已包含完整模型权重，不再是基座 + adapter 的形式，加载时要删掉之前的 `peft_config`（以及 adapter 相关配置）。\n\n3. **运行推理**：\n\n```bash\nllamafactory-cli chat chat.yaml\n```\n\n补充说明：\n- 资料里以 Qwen3 为例（SFT 全参目录 `outputs/qwen3_full` 或合并目录 `outputs/qwen3_merged` 都按此方式加载），对 LLaMA 模型流程相同，把路径换成你自己的基座/导出目录即可。\n- 完整推理参数可参考文档中的「推理参数（../configuration/inference.md）」部分，资料中未展开具体字段列表。"}, {"code": "Q106", "qid": "10", "type": "操作类", "q": "请问单机多卡怎么训练", "ctx": "webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > accelerate¶(41.12) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > torchrun¶(40.73) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(33.81) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(33.71) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 单机多卡¶ > (33.3) ｜ webdocs/advanced__distributed.md#分布训练¶ > NativeDDP¶ > 单机多卡¶ > llamafactor(31.99)", "ref": "您可以使用 llamafactory-cli 启动 NativeDDP 引擎。", "ans": "单机多卡训练有以下几种方式：\n\n## 1. NativeDDP 引擎\n\n**方式一：torchrun 启动**\n\n```bash\ntorchrun --standalone --nnodes=1 --nproc-per-node=8 src/train.py \\\n    --stage sft \\\n    --model_name_or_path meta-llama/Meta-Llama-3-8B-Instruct \\\n    --do_train \\\n    --dataset alpaca_en_demo \\\n    --template llama3 \\\n    --finetuning_type lora \\\n    --output_dir saves/llama3-8b/lora/ \\\n    --overwrite_cache \\\n    --per_device_train_batch_size 1 \\\n    --gradient_accumulation_steps 8 \\\n    --lr_scheduler_type cosine \\\n    --logging_steps 100 \\\n    --save_steps 500 \\\n    --learning_rate 1e-4 \\\n    --num_train_epochs 2.0 \\\n    --plot_loss \\\n    --bf16\n```\n\n**方式二：llamafactory-cli 启动**\n\n```bash\nFORCE_TORCHRUN=1 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml\n```\n\n- 如果未指定 `CUDA_VISIBLE_DEVICES`，默认使用所有 GPU\n- 如需指定 GPU（例如第 0、1 个），可以这样：\n\n```bash\nFORCE_TORCHRUN=1 CUDA_VISIBLE_DEVICES=0,1 llamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml\n```\n\n**方式三：accelerate 启动**\n\n先运行 `accelerate config`，根据提示回答一系列问题后生成配置文件，再用 accelerate 启动即可。\n\n## 2. DeepSpeed 引擎\n\n**方式一：deepspeed 指令启动**\n\n```bash\ndeepspeed --num_gpus 8 src/train.py \\\n    --deepspeed examples/deepspeed/ds_z3_config.json \\\n    --stage sft \\\n    --model_name_or_path meta-llama/Meta-Llama-3-8B-Instruct \\\n    ...（其余参数同上）\n```\n\n> 注意：使用 `deepspeed` 指令启动时**无法用 `CUDA_VISIBLE_DEVICES` 指定 GPU**，需要用 `--include` 参数指定，例如：`deepspeed --include localhost:1 your_program.py <normal cl args> --deepspeed ds_config.json`\n\n**方式二：llamafactory-cli 启动**\n\n```bash\nFORCE_TORCHRUN=1 llamafactory-cli train examples/train_full/qwen3_full_sft.yaml\n```\n\n需在配置文件中通过 `deepspeed` 参数指定 DeepSpeed 配置文件路径：\n\n```yaml\n...\ndeepspeed: examples/deepspeed/ds_z3_config.json\n...\n```\n\n## 3. FSDP 引擎\n\n使用 accelerate 启动，节点数与 GPU 数可通过 `num_machines` 和 `num_processes` 指定。运行 `accelerate config` 按提示生成 FSDP 所需配置文件，也可以自行配置 `fsdp_config.yaml`。"}, {"code": "Q107", "qid": "7", "type": "操作类", "q": "请问怎么缓解大模型微调后重复输出同一句话 —— 当把max_length调小时，生成内容不完整。把max_length调大后，模型生成完内容之后，会重复输出最后一句话去达到最大max_length，请问这种现象如何缓解。谢谢！", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(36.19) ｜ webdocs/advanced__trainers.md#训练方法¶ > Post-training¶ > Supervised Fine(17.99) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(16.34) ｜ webdocs/advanced__tuning_algorithms.md#调优算法¶ > Full Parameter Fine-tuning¶(15.11) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(14.62) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 微调参数¶ > BAdam¶(12.37)", "ref": "对生成重复 token 的惩罚系数。对于已经生成过的 token 生成概率乘以 1/repetition_penalty。值小于 1.0 会提高重复 token 的生成概率，大于 1.0 则会降低重复 token 的生成概率。", "ans": "您描述的现象是微调模型在生成文本时可能出现的重复输出问题。根据提供的资料，可以尝试以下方法来缓解这一问题：\n\n1. **调整 `repetition_penalty` 参数**：`repetition_penalty` 参数用于对生成重复 token 的惩罚系数。您可以尝试增加这个值，以降低模型重复生成相同句子的概率。例如，将 `repetition_penalty` 设置为大于 1.0 的值，如 1.5 或更高。\n\n2. **使用 `top_p` 和 `top_k` 参数**：通过调整 `top_p` 和 `top_k` 参数，可以控制生成时候选 token 的集合大小，从而减少重复生成的可能性。例如，可以尝试将 `top_p` 设置为 0.8 或更高，`top_k` 设置为 50 或更高。\n\n3. **调整 `temperature` 参数**：`temperature` 参数用于调整生成文本的随机性。您可以尝试降低 `temperature` 值，使生成的文本更加确定，从而减少重复输出的可能性。\n\n4. **使用 `num_beams` 参数**：`num_beams` 参数用于控制 beam search 的束宽度。您可以尝试增加 `num_beams` 的值，以提高生成文本的多样性，从而减少重复输出的可能性。\n\n5. **调整 `max_length` 和 `max_new_tokens` 参数**：确保 `max_length` 和 `max_new_tokens` 参数设置合理，避免生成文本过长导致重复输出。如果 `max_length` 设置过大，可以适当减小，以确保生成文本的完整性。\n\n通过上述方法的调整，可以有效缓解微调模型在生成文本时重复输出同一句话的问题。如果问题仍然存在，可能需要进一步调整模型的训练参数或使用更复杂的解码策略。"}, {"code": "Q108", "qid": "31", "type": "补充类", "q": "How to use accelerate to SFT with multiple machines?", "ctx": "webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (32.63) ｜ webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(27.71) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (27.3) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(26.9) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶ > F(24.97) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (23.04)", "ref": "使用 accelerate 启动并指定多机配置文件：`accelerate launch --config_file fsdp_config_multiple_nodes.yaml train.py llm_config.yaml`。", "ans": "以下是使用 `accelerate` 进行多机多卡训练的方法（以 FSDP 为例）：\n\n## 1. 生成配置文件\n\n运行以下命令，根据提示回答一系列问题生成多机 FSDP 配置文件：\n\n```bash\naccelerate config\n```\n\n也可以根据需求自行编写配置文件。\n\n## 2. 需要注意的关键参数\n\n- `num_machines`：节点（机器）的数量\n- `num_processes`：所有节点上的 GPU 总数，即 `num_machines * num_processes_per_machine`\n- `main_process_ip`：主进程所在节点的 IP 地址，**所有节点必须使用相同的 IP**\n- `main_process_port`：主进程端口号，**所有节点必须使用相同的端口**\n- `machine_rank`：当前节点的编号，从 0 开始；**主节点的 machine_rank 必须为 0**\n\n## 3. 示例配置文件（双机 16 卡）\n\n```yaml\n#examples/accelerate/fsdp_config_multiple_nodes.yaml\ncompute_environment: LOCAL_MACHINE\ndebug: false\ndistributed_type: FSDP\ndowncast_bf16: 'no'\nfsdp_config:\n fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP\n fsdp_backward_prefetch: BACKWARD_PRE\n fsdp_forward_prefetch: false\n fsdp_cpu_ram_efficient_loading: true\n fsdp_offload_params: false\n fsdp_sharding_strategy: FULL_SHARD\n fsdp_state_dict_type: FULL_STATE_DICT\n fsdp_sync_module_states: true\n fsdp_use_orig_params: true\nmachine_rank: 0\nmain_training_function: main\nmixed_precision: bf16 # or fp16\nmain_process_ip: 192.168.0.1\nmain_process_port: 29500\nnum_machines: 2\nnum_processes: 16\nrdzv_backend: static\nsame_network: true\ntpu_env: []\ntpu_use_cluster: false\ntpu_use_sudo: false\nuse_cpu: false\n```\n\n## 4. 启动训练\n\n配置完成后，在**所有机器上**运行：\n\n```bash\naccelerate launch \\\n--config_file fsdp_config_multiple_nodes.yaml \\\ntrain.py llm_config.yaml\n```\n\n## 其他方式\n\n- **DeepSpeed**：同样可以通过 `accelerate config` 生成 DeepSpeed 配置文件，使用 `accelerate` 指令启动 DeepSpeed 引擎进行多机训练。\n- **Ray**：如使用 Ray 提交 FSDP 多机任务，需将 `fsdp_config.yaml` 中 `num_processes` 设为 1 且无需设置多机相关参数，然后通过 `ray job submit` 提交任务。\n\n需要说明的是，资料中给出的启动命令是通用训练示例（`train.py llm_config.yaml` / `src/train.py training_config.yaml`），资料里没有找到专门针对 SFT 的具体启动命令写法。"}, {"code": "Q109", "qid": "50", "type": "操作类", "q": "【DPO相关】请问DPO训练结束后，应该如何进行推理呢？能使用类似SFT训练后推理的脚本吗", "ctx": "webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(24.72) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(24.72) ｜ webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(23.97) ｜ docs/zh/feature-guide/dpo.md#偏好优化（DPO） > 训练配置(21.76) ｜ docs/zh/feature-guide/dpo.md#偏好优化（DPO） > 参考模型(21.74) ｜ docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(19.81)", "ref": "LoRA 推理通过 `model` 指定训练时的基座，通过 `peft_config.adapter_name_or_path` 指定 adapter。", "ans": "可以的。DPO 训练后的推理方式和 SFT 一样，推理配置的写法完全相同，只是把 adapter 路径换成 DPO 的输出目录即可。根据 DPO 训练方式不同分两种情况：\n\n**1. LoRA DPO（配置了 `peft_config`，如资料中的示例）**\n\n输出目录 `outputs/qwen3_dpo` 里是 LoRA 权重，推理时需要指定基座模型 + adapter，参考 `examples/inference/qwen3_lora_sft.yaml` 的格式：\n\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B        # DPO 训练时的基座模型\nadapter_name_or_path: outputs/qwen3_dpo  # 换成 DPO 的输出目录\ntemplate: qwen3_nothink\ninfer_backend: huggingface # 可选 [huggingface, vllm]\ntrust_remote_code: true\n```\n\n然后即可启动推理（chat / api 服务等均可），例如启动 API 服务：\n\n```bash\nAPI_PORT=8000 CUDA_VISIBLE_DEVICES=0 llamafactory-cli api <上面的yaml>\n```\n\n**2. 全参 DPO（未配置 `peft_config`）**\n\n输出目录中包含完整模型权重，此时不需要 adapter 路径。参考「使用训练或合并后的模型」的做法：把推理配置（如 `chat.yaml`）中的模型路径改为输出目录、移除 `peft_config` 配置项、保留采样参数，然后运行：\n\n```bash\nllamafactory-cli chat chat.yaml\n```\n\n（也可以先用导出功能合并权重，再指向合并后的目录推理。）\n\n**小结**：DPO 与 SFT 在推理层面没有区别，同一个推理脚本/配置都能用，核心就是把 `adapter_name_or_path`（LoRA 情况）或模型路径（全参情况）指向 DPO 的输出结果。\n\n> 提示：`template` 需要与模型匹配，资料中 Qwen3 示例使用的是 `qwen3_nothink`；完整推理参数可参考推理参数文档。"}, {"code": "Q110", "qid": "56", "type": "参数类", "q": "video_maxlen 和 cutoff_len 分别是什么含义？", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > 多模态模型¶(15.1) ｜ docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(11.28) ｜ docs/zh/configuration/data.md#数据参数 > DataArguments(7.88) ｜ examples/train_lora/mossvl_lora_sft.yaml#examples/train_lora/mossvl_lora_sft.yaml(5.79) ｜ examples/train_full/mossvl_full_sft.yaml#examples/train_full/mossvl_full_sft.yaml(5.79) ｜ docs/zh/configuration/data.md#数据参数 > DatasetInfo(5.62)", "ref": "video_maxlen 是视频输入的最大采样帧数，默认 128；cutoff_len 是输入的最大 token 数，超过会被截断，默认 2048。", "ans": "这两个参数属于不同层面的配置：\n\n**`video_maxlen`（多模态模型参数）**\n- 含义：视频输入的**最大采样帧数**，即一段视频最多被采样成多少帧送入模型。\n- 默认值：`128`\n- 常与 `video_fps`（采样帧率）配合使用，例如示例配置中 `video_fps: 1.0` 且 `video_maxlen: 256`。\n\n**`cutoff_len`（训练参数 TrainingArguments）**\n- 含义：训练时的**最大序列长度**，超过该长度的序列会被截断。\n- 默认值：`2048`\n\n简单来说，`video_maxlen` 控制视频采样后的帧数上限，`cutoff_len` 控制输入模型的 token 序列长度上限。"}, {"code": "Q111", "qid": "60", "type": "参数类", "q": "GeneratingArguments 中的 max_new_tokens 有默认值，任何情况下 max_length 都不会生效", "ctx": "webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(27.81) ｜ docs/zh/configuration/inference.md#推理参数 > SampleArguments(17.22) ｜ docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(12.18) ｜ webdocs/advanced__model_support.md#模型支持¶ > 多模态数据构建¶(6.68) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 配置字段¶ > 数据与 checkpoin(6.52) ｜ docs/zh/feature-guide/inference.md#推理 > 启动 CLI 对话(5.52)", "ref": "max_new_tokens 默认值为 1024，其说明是「生成文本的最大长度。设置 max_new_tokens 会覆盖 max_length」，所以只设 max_length 而不设 max_new_tokens 时，max_length 会被默认的 max_new_tokens 覆盖。", "ans": "根据资料 1 中的参数介绍，`max_new_tokens` 有默认值 1024，而 `max_length` 会覆盖 `max_new_tokens`。因此，当设置 `max_new_tokens` 时，`max_length` 的值将被忽略。"}, {"code": "Q112", "qid": "5", "type": "参数类", "q": "多机多卡，设置 data_shared_file_system 为 true 时每个 worker 都要算一遍 tokenize", "ctx": "webdocs/advanced__distributed.md#accelerate_singleNode_config.yaml > 多机多卡(29.15) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > Ray¶ > 多机多卡¶(27.26) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 数据参数¶(25.11) ｜ webdocs/advanced__distributed.md#accelerate_multiNode_config.yaml > DeepS(24.45) ｜ docs/zh/feature-guide/distributed_training.md#分布式训练 > 配置多机启动(24.24) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > FSDP¶ > 多机多卡¶ > (23.95)", "ref": "文档说明相反：data_shared_file_system 为 true 时数据集处理只在第一个 node 发生，为 false 时每个 node 都处理一次，默认 false。若出现每个 worker 都 tokenize，应检查该值是否被设为 false。", "ans": "不是的，正好相反。根据参数文档：\n\n| 参数名称 | 默认值 | 说明 |\n|---|---|---|\n| `data_shared_file_system` | false | 多机多卡时，不同机器存放数据集的路径是否是共享文件系统。**为 `true` 时数据集处理只在第一个 node 发生**；为 `false` 时在每个 node 都处理一次 |\n\n也就是说：\n\n- **`data_shared_file_system: true`**（各节点通过共享文件系统访问同一份数据）：tokenize 等数据集处理**只在第一个节点执行一次**，其他节点直接复用结果，不会重复处理。\n- **`data_shared_file_system: false`**（各节点各自有一份数据）：每个节点都会**各自处理一遍**数据集。\n\n所以如果你的场景是每个 worker 都在重复 tokenize，应检查该参数是否被设成了默认的 `false`；如果数据集放在共享存储（如 NFS）上，将其设为 `true` 即可避免重复处理。"}, {"code": "Q113", "qid": "32", "type": "参数类", "q": "请问如何添加自定义模型？", "ctx": "webdocs/advanced__model_support.md#模型支持¶(35.94) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(31.65) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(20.79) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(17.81) ｜ webdocs/advanced__megatron_bridge.md#extra_config: /path/to/overrides.json > (17.74) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(16.92)", "ref": "注册模型的template，解析多模态数据并构建messages", "ans": "根据资料，以 LLaMA-4 多模态模型为例，添加自定义模型支持主要包括以下步骤：\n\n## 一、主要任务\n\n对于多模态模型，需要完成两个主要任务：\n1. **注册模型的 template**\n2. **解析多模态数据并构建 messages**\n\n## 二、获取模型的 chat_template\n\n可以先通过 transformers 获取模型的原始 template，例如：\n\n```python\nfrom transformers import AutoTokenizer\n\ntokenizer = AutoTokenizer.from_pretrained(\"unsloth/Llama-4-Scout-17B-16E-Instruct\")\nmessages = [\n    {\"role\": \"user\", \"content\": r\"{{content}}\"},\n    {\"role\": \"assistant\", \"content\": r\"{{content}}\"},\n    {\"role\": \"system\", \"content\": r\"{{content}}\"},\n    {\"role\": \"tool\", \"content\": r\"{{content}}\"}\n]\n\ntext = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)\nprint(text)\n```\n\n也可以直接通过 huggingface repo 获取模型的 template。通过观察输出即可得知各消息类型的模板格式，例如 LLaMA-4 的格式为：\n\n| 消息类型 | 模板格式 |\n| 用户消息 | `<|header_start|>user<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 助手消息 | `<|header_start|>assistant<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 系统消息 | `<|header_start|>system<|header_end|>\\n\\n{{content}}<|eot|>` |\n| 工具消息 | `<|header_start|>ipython<|header_end|>\\n\\n\"{{content}}\"<|eot|>` |\n\n## 三、注册 template\n\n在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法注册 chat_template，需要填写以下字段：\n\n- `name`：模板名称\n- `format_user`：用户消息格式\n- `format_assistant`：助手消息格式\n- `format_system`：系统消息格式\n- `format_observation`：观察（工具输出）消息格式\n- `format_prefix`：模型开头部分，通常可在 **tokenizer_config.json** 中找到\n- `stop_words`：停止词，可在 **generation_config.json** 中找到 `eos_token_id`，再把该 id 对应的 token 填入\n- `mm_plugin`：多模态模型需要在此字段指定多模态插件\n\n**注意事项**：\n- 实际应用中，往往会在用户输入的信息后添加助手回复模板的头部（如 `<|header_start|>assistant<|header_end|>`）来引导模型回复，因此助手消息格式 `format_assistant` 可省略助手回复的头部，只保留内容部分。\n- 对于多模态模型，还需要完成解析多模态数据并构建 messages 的工作。\n\n---\n\n说明：资料中关于 `register_template` 的完整代码示例部分内容不完整，具体的代码写法资料里没有完整展示，建议参考 `src/llamafactory/data/template.py` 中现有模型的注册写法。"}, {"code": "Q114", "qid": "15", "type": "补充类", "q": "命令行如何中断训练及其恢复训练？", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 模型保存¶ > 断点续训¶(38.87) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 从 Checkpoint 恢复训练(38.09) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(28.48) ｜ docs/zh/feature-guide/index.md#功能指南 > 模型保存与使用(25.4) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 初始化权重与恢复训练(24.98) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 不同后端的保存格式(22.19)", "ref": "恢复训练使用 `resume_from_checkpoint`：设为 checkpoint 路径或 `auto`（自动在 output_dir 下查找最新完整 checkpoint）；文档未说明命令行中断训练的方式。", "ans": "在命令行中中断训练，可以使用 `Ctrl+C` 或 `kill` 命令终止训练进程。若需恢复训练，需使用 `resume_from_checkpoint` 参数指定恢复的 checkpoint 路径。例如：\n\n```\noutput_dir: saves/qwen3_8b_lora_sft\nresume_from_checkpoint: saves/qwen3_8b_lora_sft/checkpoint-1000\n```\n\n此配置表示从 `output_dir` 下的 `checkpoint-1000` 目录恢复训练。若希望从 `output_dir` 中最新的完整 checkpoint 恢复训练，可设置：\n\n```\nresume_from_checkpoint: auto\n```\n\n此配置会自动查找 `output_dir` 下最新的完整 checkpoint 进行恢复。"}, {"code": "Q115", "qid": "16", "type": "操作类", "q": "我有个类似问题。假定基础模型Model 1.我在基础模型Model 的基础上用数据集A微调了LoRA权重LoRA_A 2.我想继续在LoRA权重A的基础上，用数据集B微调LoRA权重LoRA_B 我不希望将LoRA_A存成一个基础模型，我希望直接从LoRA_A的权重微调LoRA_B，获得的B_adapter直接能用在原始模型Model的权重上，我该如何操作？", "ctx": "webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > model(40.37) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > model(39.09) ｜ docs/zh/feature-guide/model_export.md#模型导出 > 合并多个 Adapter(39.05) ｜ docs/zh/feature-guide/sft.md#监督微调（SFT） > LoRA(34.97) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > 量化¶ > export(34.82) ｜ webdocs/getting_started__merge_lora.md#模型保存、LoRA 合并与量化¶ > LoRA 合并¶ > export(34.34)", "ref": "通过 `peft_config.name: lora` 配置。在上述训练配置中加入以下块，并将 `output_dir` 改为 `outputs/qwen3_lora`；基座仍为 `Qwen/Qwen3-0.6B`", "ans": "可以做到，不需要先把 LoRA_A 合并成完整模型。关键是在训练配置里通过 `adapter_name_or_path` 指向 LoRA_A 的输出目录，框架会直接从该 adapter 恢复 LoRA 参数继续训练（资料：训练时只允许一个 adapter，LoRA 参数从 adapter 自身恢复）。\n\n配置示例（沿用 SFT 文档的风格）：\n\n```yaml\nmodel: Model                    # 仍使用原始基座模型\nadapter_name_or_path: outputs/lora_a   # 上一次训练保存 LoRA_A 的目录（即当时的 output_dir）\n\npeft_config:\n  name: lora\n  r: 16\n  lora_alpha: 32\n  lora_dropout: 0.05\n  target_modules: all\n\ndataset: 数据集B\noutput_dir: outputs/lora_b      # 新 adapter（LoRA_B）的保存位置\n```\n\n几点说明：\n\n- **训练阶段**：基座填原始 Model，`adapter_name_or_path` 填 LoRA_A 的输出目录，训练数据换成数据集 B，结果保存到新的 `output_dir`（即 LoRA_B）。\n- **结果可用性**：由于 LoRA 参数是从 LoRA_A 恢复后继续训练的，得到的 LoRA_B 已包含 A+B 的全部更新，结构上与原始 Model 匹配，推理或导出时只需 `adapter_name_or_path: outputs/lora_b` 即可直接用在原始 Model 上。\n- **注意事项**：adapter 必须与基座模型匹配（与合并多个 adapter 时的要求一致）；如果之后要把 LoRA_B 合并回 Model 导出，请使用未量化的模型进行合并，不要指定量化位数。"}, {"code": "Q116", "qid": "54", "type": "操作类", "q": "如何同时使用yaml文件和命令行参数？", "ctx": "docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(14.86) ｜ docs/zh/feature-guide/inference.md#推理 > 启动 CLI 对话(13.79) ｜ webdocs/getting_started__sft.md#SFT 训练¶ > 命令行¶(12.28) ｜ webdocs/advanced__distributed.md#deepspeed_config.yaml > DeepSpeed 配置文件¶ (10.4) ｜ webdocs/getting_started__sft.md#SFT 训练¶ > 命令行¶ > examples/train_lora/qwe(10.17) ｜ docs/zh/feature-guide/model_saving.md#模型保存与恢复 > 保存训练 Checkpoint(10.13)", "ref": "您可以使用以下命令使用 `examples/train_lora/qwen3_lora_sft.yaml` 中的参数进行微调：", "ans": "可以直接在命令行中指定 yaml 文件路径，并在其后追加 `key=value` 形式的参数来覆盖 yaml 中的配置。例如：\n\n```bash\nllamafactory-cli train examples/train_lora/qwen3_lora_sft.yaml \\\n learning_rate=1e-5 \\\n logging_steps=1\n```\n\n即：`llamafactory-cli train <yaml文件> 参数1=值1 参数2=值2 ...`，追加的参数会更新（覆盖）yaml 文件中对应字段的值。"}, {"code": "Q117", "qid": "43", "type": "操作类", "q": "请教如何编写template —— 您好，想向您请教下如何自定义template  原始Input：    原始配置：   原始样例返回内容：    改写的template：    改写后返回内容： ` 问题：“你好，你是谁？” {\"role\":\"assistant\",\"content\":\"\\n我是李华，你是谁？\\n\\n\"} `", "ctx": "webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(41.54) ｜ docs/zh/feature-guide/inference.md#推理 > 覆盖模型 Chat Template(37.99) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(35.05) ｜ webdocs/getting_started__data_preparation.md#数据处理¶ > ShareGPT¶ > OpenAI格式¶(32.29) ｜ webdocs/advanced__model_support.md#模型支持¶ > 注册 template¶(31.41) ｜ docs/zh/feature-guide/data_preparation.md#数据准备 > DPO/RM 数据格式(20.03)", "ref": "我们可以在 `src/llamafactory/data/template.py` 中使用 `register_template` 方法为自定义模型注册 chat_template。", "ans": "根据提供的资料，自定义 template 的方法是使用 `custom_chat_template` 参数，它接收一个 Jinja2 模板字符串来覆盖 tokenizer 自带的模板。例如，如果你希望自定义模板，可以按照以下方式编写：\n\n```yaml\nmodel: path/to/model\ncustom_chat_template: >-\n  {% for message in messages %}\n  {{ message['role'] + ': ' + message['content'] }}\n  {% endfor %}\n```\n\n这个模板会将每条消息的 role 和 content 拼接起来，形成类似如下格式的输出：\n\n```\n用户: 你好，你是谁？\n助手: 我是李华，你是谁？\n```\n\n如果你希望在每条消息后添加特定的标记（如 `<|header_start|>assistant<|header_end|>`），你需要在模板中加入这些标记。例如：\n\n```yaml\ncustom_chat_template: >-\n  {% for message in messages %}\n  {{ message['role'] + ': ' + message['content'] }}<|header_start|>assistant<|header_end|>\n  {% endfor %}\n```\n\n这样，每条消息后都会添加指定的标记。请根据你的具体需求调整模板内容。如果需要更复杂的模板，可以参考 `register_template` 方法来为自定义模型注册 chat_template。"}, {"code": "Q118", "qid": "49", "type": "参数类", "q": "seq_length 为什么是 8192，而 cutoff_len 设置为 4096 时？", "ctx": "docs/zh/configuration/training.md#训练参数 > TrainingArguments > 训练过程与精度(16.08) ｜ docs/zh/feature-guide/batching.md#批处理策略(11.83) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 生成参数¶(7.7) ｜ webdocs/advanced__arguments.md#参数介绍¶ > 模型参数¶ > vllm 推理¶(7.45) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 配置字段¶ > 并行¶(4.81) ｜ webdocs/advanced__megatron_bridge.md#Megatron Bridge¶ > 并行与批大小¶(4.13)", "ref": "批处理策略中每个 micro-batch 的 token 预算 = cutoff_len × micro_batch_size。示例中 cutoff_len: 2048、micro_batch_size: 4，预算即为 2048 × 4 = 8192。", "ans": "资料里没有找到。\n\n提供的资料中没有任何关于 `seq_length` 参数的说明，也没有提到 `seq_length` 与 `cutoff_len` 之间存在 2 倍或其他换算关系。\n\n资料中仅能确认：\n- `cutoff_len` 是训练参数中的「最大序列长度」，默认值为 `2048`（资料 1）。\n- 在 Megatron Bridge 相关资料（资料 5、6）中未出现 `seq_length` 字段。\n- 动态批处理策略下 `cutoff_len × micro_batch_size` 会构成 token 预算（资料 2），但这只影响 batch 的样本组织方式，与 `seq_length` 变为 2 倍无关。\n\n如果您是在 Megatron Bridge 的日志或配置中看到 `seq_length=8192`，建议检查是否在其他配置文件（如模型或数据配置）中单独设置了该值，此问题需查阅资料以外的文档才能确认。"}, {"code": "Q119", "qid": "28", "type": "补充类", "q": "如何设置模型推理的一些参数如 temperature？", "ctx": "webdocs/getting_started__inference.md#推理¶ > 原始模型推理配置¶ > examples/inference/qwe(30.7) ｜ webdocs/getting_started__inference.md#推理¶ > 微调模型推理配置¶ > examples/inference/qwe(30.15) ｜ webdocs/getting_started__inference.md#推理¶ > 多模态模型¶(24.94) ｜ webdocs/getting_started__inference.md#推理¶ > 批量推理¶ > examples/inference/qwen3_l(23.63) ｜ examples/README_zh.md#目录 > 示例 > 推理 LoRA 模型 > 使用 vLLM 多卡推理评估(19.82) ｜ docs/zh/feature-guide/inference.md#推理 > 使用训练或合并后的模型(19.02)", "ref": "通过 `temperature` 参数设置：用于调整生成文本的随机性，默认值 0.95；temperature 越高生成越随机，越低越确定。", "ans": "根据提供的资料，**没有直接给出 temperature 等采样参数的具体设置方法和参数名**，资料里没有找到相关内容。\n\n资料中与此相关的信息仅有：\n\n1. **资料 6** 提到使用训练或合并后的完整模型推理时，应「保留采样参数并运行 `llamafactory-cli chat chat.yaml`」，并指出完整字段可参见推理参数文档（`docs/zh/configuration/inference.md`，即「推理参数」章节）。\n\n2. 资料中给出的推理配置示例（如 `examples/inference/qwen3.yaml`）只包含以下字段：\n```yaml\nmodel_name_or_path: Qwen/Qwen3-4B-Instruct-2507\ntemplate: qwen3_nothink\ninfer_backend: huggingface  # choices: [huggingface, vllm]\ntrust_remote_code: true\n```\n\n建议您查阅 LlamaFactory 文档中的「推理参数」（`configuration/inference.md`）章节，那里包含 temperature 等采样参数的完整字段说明。"}];
const KEY = 'llmloop_v3_grades_v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }

let idx = 0;
let pending = null;

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function gradedCount() { return ITEMS.filter(it => state[it.code]).length; }

function nextUnjudged(from) {
  for (let i = from; i < ITEMS.length; i++) if (!state[ITEMS[i].code]) return i;
  for (let i = 0; i < ITEMS.length; i++) if (!state[ITEMS[i].code]) return i;
  return -1;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function render() {
  const total = ITEMS.length, done = gradedCount();
  document.getElementById('total').textContent = total;
  document.getElementById('left').textContent = total - done;
  document.getElementById('fill').style.width = (done / total * 100) + '%';

  if (idx < 0) {
    document.getElementById('view').innerHTML =
      '<div class="done"><h2 style="font-weight:500">82 条判完了</h2>' +
      '<p class="meta">点右上角「导出判分 CSV」，然后跑：<br>' +
      '<code>python scripts/grade_aid.py apply 下载的.csv</code></p></div>';
    document.getElementById('dock').classList.add('hidden');
    return;
  }
  document.getElementById('dock').classList.remove('hidden');

  const it = ITEMS[idx];
  const cur = state[it.code];
  const ansHtml = it.ans.trim()
    ? '<div class="txt ans">' + esc(it.ans) + '</div>'
    : '<div class="txt empty">（空回答 —— 输出被截断，判「错」+「格式错」）</div>';

  document.getElementById('view').innerHTML =
    '<div class="row" style="margin-top:12px">' +
      '<span class="code">' + esc(it.code) + '</span>' +
      '<span class="meta">题号 ' + esc(it.qid) + '</span>' +
      '<span class="tag">' + esc(it.type) + '</span>' +
      (cur ? '<span class="meta">已判：' + esc(cur.g) + '</span>' : '') +
      '<span class="grow"></span>' +
      '<span class="meta">第 ' + (idx + 1) + ' / ' + ITEMS.length + '</span>' +
    '</div>' +
    '<div class="card"><div class="label">问题</div><div class="q">' + esc(it.q) + '</div></div>' +
    '<div class="card"><div class="label">检索到的段落</div><div class="ctx">' + esc(it.ctx) + '</div></div>' +
    '<div class="card"><div class="label">标准答案（判分依据，文档原文）</div><div class="ref txt">' + esc(it.ref) + '</div></div>' +
    '<div class="card"><div class="label">模型回答</div>' + ansHtml + '</div>';

  showReason(false);
  window.scrollTo(0, 0);
}

function showReason(on) {
  document.getElementById('reasonRow').classList.toggle('hidden', !on);
  document.getElementById('gradeRow').classList.toggle('hidden', on);
  if (on) {
    document.querySelectorAll('#reasonRow button').forEach(b => b.classList.remove('on'));
    document.getElementById('why').value = pending && pending.why ? pending.why : '';
    setTimeout(() => document.getElementById('why').focus(), 0);
  }
}

function commit(g, reason, why) {
  const it = ITEMS[idx];
  state[it.code] = { g: g, reason: reason || '', why: why || '' };
  save();
  pending = null;
  idx = nextUnjudged(idx + 1);
  render();
}

document.querySelectorAll('#gradeRow button[data-g]').forEach(btn => {
  btn.onclick = () => {
    const g = btn.dataset.g;
    if (g === '对') commit('对', '', '');
    else { pending = { g: g }; showReason(true); }
  };
});

document.querySelectorAll('#reasonRow button[data-r]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#reasonRow button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    if (pending) pending.reason = btn.dataset.r;
    document.getElementById('why').focus();
  };
});

document.getElementById('why').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const why = document.getElementById('why').value.trim();
    if (!pending || !pending.reason) {
      document.getElementById('why').placeholder = '先按 1-4 选一个失败原因';
      return;
    }
    commit(pending.g, pending.reason, why);
  } else if (e.key === 'Escape') {
    pending = null; showReason(false);
  }
  e.stopPropagation();
});

document.getElementById('skip').onclick = () => { idx = nextUnjudged(idx + 1); render(); };
document.getElementById('prev').onclick = () => { idx = Math.max(0, idx - 1); render(); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (pending) {
    const map = { '1': '检索没命中', '2': '编造内容', '3': '理解错', '4': '格式错' };
    if (map[e.key]) {
      pending.reason = map[e.key];
      document.querySelectorAll('#reasonRow button').forEach(b => {
        b.classList.toggle('on', b.dataset.r === map[e.key]);
      });
      document.getElementById('why').focus();
    }
    return;
  }
  if (e.key === '1') commit('对', '', '');
  else if (e.key === '2') { pending = { g: '部分对' }; showReason(true); }
  else if (e.key === '3') { pending = { g: '错' }; showReason(true); }
  else if (e.key === ' ') { e.preventDefault(); idx = nextUnjudged(idx + 1); render(); }
  else if (e.key === 'ArrowLeft') { idx = Math.max(0, idx - 1); render(); }
});

document.getElementById('export').onclick = () => {
  const rows = [['代号', '人工判分', '失败原因', '判断理由']];
  ITEMS.forEach(it => {
    const s = state[it.code];
    if (s) rows.push([it.code, s.g, s.reason || '', s.why || '']);
  });
  const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'v3_grades.csv';
  a.click();
};

idx = nextUnjudged(0);
render();
</script>
</body>
</html>
