<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库核对 · 140 道</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#fff; --line:#e3e1da; --ink:#1f1e1b; --dim:#6b6a64;
    --blue:#2563eb; --green:#15803d; --amber:#b45309; --red:#b91c1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid var(--line);
    padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{font-weight:600}
  .bar{flex:1; min-width:140px; height:8px; background:#eceae4; border-radius:4px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--green); transition:width .2s}
  .stat{color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  .stat b{color:var(--ink)}
  header button{
    border:1px solid var(--line); background:#fff; border-radius:6px;
    padding:6px 12px; cursor:pointer; font-size:14px; color:var(--ink);
  }
  header button:hover{background:#f3f2ee}
  main{max-width:1180px; margin:0 auto; padding:20px; display:grid; gap:16px;
       grid-template-columns:1fr 400px; align-items:start}
  @media (max-width:940px){ main{grid-template-columns:1fr} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px}
  .card + .card{margin-top:14px}
  .lab{font-size:12px; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; margin-bottom:6px}
  .big{font-size:17px; line-height:1.7}
  .quote{background:#fbfaf7; border-left:3px solid #d9d5c9; padding:10px 12px; border-radius:0 6px 6px 0;
         font-size:14px; color:#3a3934; white-space:pre-wrap; word-break:break-word}
  .ctx{font-size:13px; color:var(--dim); white-space:pre-wrap; word-break:break-word;
       max-height:190px; overflow:auto; background:#fbfaf7; padding:10px 12px; border-radius:6px}
  .meta{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--dim); align-items:center}
  .meta a{color:var(--blue); text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .pill{border-radius:999px; padding:1px 9px; font-size:12px; border:1px solid var(--line)}
  .pill.must{background:#eef6ff; border-color:#bfdbfe; color:#1d4ed8}
  .pill.opt{background:#f5f4ef; color:#6b6a64}

  textarea{
    width:100%; min-height:120px; resize:vertical; padding:12px; border-radius:8px;
    border:1px solid var(--line); font:15px/1.6 inherit; background:#fff; color:var(--ink);
  }
  textarea:focus{outline:2px solid #bfdbfe; border-color:#93c5fd}
  .hint{font-size:12px; color:var(--dim); margin-top:6px}

  .verdict{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  .verdict button{
    padding:12px 8px; border-radius:8px; border:1px solid var(--line); background:#fff;
    cursor:pointer; font-size:15px; font-weight:500; color:var(--ink);
  }
  .verdict button kbd{display:block; font-size:11px; color:var(--dim); font-weight:400; margin-top:2px}
  .verdict button.ok:hover{background:#f0fdf4; border-color:#86efac}
  .verdict button.ok.on{background:#dcfce7; border-color:#4ade80; color:var(--green)}
  .verdict button.fix:hover{background:#fffbeb; border-color:#fcd34d}
  .verdict button.fix.on{background:#fef3c7; border-color:#fbbf24; color:var(--amber)}
  .verdict button.cut:hover{background:#fef2f2; border-color:#fca5a5}
  .verdict button.cut.on{background:#fee2e2; border-color:#f87171; color:var(--red)}

  .nav{display:flex; gap:10px; margin-top:12px}
  .nav button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--line);
              background:#fff; cursor:pointer; font-size:14px; color:var(--ink)}
  .nav button:hover{background:#f3f2ee}
  .nav .next{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:500}
  .nav .next:hover{background:#1d4ed8}

  .done{color:var(--green); font-size:13px; margin-top:8px; min-height:18px}
  .warn{background:#fffbeb; border:1px solid #fde68a; color:#92400e; padding:10px 12px;
        border-radius:8px; font-size:13px; margin-bottom:14px}
</style>
</head>
<body>
<header>
  <span class="brand">题库核对</span>
  <div class="bar"><i id="bar"></i></div>
  <span class="stat">已完成 <b id="done">0</b> / <b id="total">0</b></span>
  <span class="stat" id="pos">第 1 条</span>
  <button id="export">导出 CSV</button>
  <button id="reset">清空进度</button>
</header>

<main>
  <section>
    <div class="card">
      <div class="meta" style="margin-bottom:10px">
        <span id="seq" class="pill opt">#1</span>
        <span id="pri" class="pill must">必选</span>
        <a id="issue" href="#" target="_blank" rel="noopener">issue</a>
        <span id="seg" style="font-size:12px"></span>
      </div>
      <div class="lab">草稿答案（要核对的）</div>
      <div class="big" id="ans"></div>
    </div>

    <div class="card">
      <div class="lab">文档原文（答案必须被它支持）</div>
      <div class="quote" id="quote"></div>
    </div>

    <div class="card">
      <div class="lab">所在段落上下文</div>
      <div class="ctx" id="ctx"></div>
    </div>
  </section>

  <aside>
    <div class="warn" id="warn" style="display:none"></div>

    <div class="card">
      <div class="lab">问题（你来写）</div>
      <textarea id="q" placeholder="把 issue 改写成一句提问。例如：lora_target 参数的作用和默认值是什么？"></textarea>
      <div class="hint">Ctrl/⌘ + Enter 保存并下一条</div>
    </div>

    <div class="card">
      <div class="lab">核对结果</div>
      <div class="verdict">
        <button class="ok" data-v="对">对<kbd>1</kbd></button>
        <button class="fix" data-v="改">要改<kbd>2</kbd></button>
        <button class="cut" data-v="砍">砍掉<kbd>3</kbd></button>
      </div>
      <div class="done" id="msg"></div>
      <div class="nav">
        <button id="prev">← 上一条</button>
        <button class="next" id="next">下一条 →</button>
      </div>
    </div>
  </aside>
</main>

<script>
const DATA = /*__DATA__*/[];
const KEY = 'qbank_140_v1';

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
let idx = 0;

const $ = id => document.getElementById(id);

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function rec(i){ return state[DATA[i].i] || (state[DATA[i].i] = {q:'', v:''}); }

function render(){
  const it = DATA[idx];
  const r = rec(idx);
  $('seq').textContent = '#' + it.i;
  $('pri').textContent = it.pri;
  $('pri').className = 'pill ' + (it.pri === '必选' ? 'must' : 'opt');
  $('issue').textContent = 'issue #' + it.issue;
  $('issue').href = it.url;
  $('seg').textContent = it.seg;
  $('ans').textContent = it.ans || '（空）';
  $('quote').textContent = it.quote || '（没有原文引用）';
  $('ctx').textContent = it.ctx || '（无上下文）';
  $('q').value = r.q || '';
  $('pos').textContent = '第 ' + (idx + 1) + ' 条';

  document.querySelectorAll('.verdict button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === r.v);
  });

  // 提示：没有原文引用时提醒
  const w = $('warn');
  if (!it.quote || it.quote.length < 8) {
    w.style.display = 'block';
    w.textContent = '⚠ 这条没有可用的文档原文，很可能不能出题，建议直接「砍掉」。';
  } else {
    w.style.display = 'none';
  }

  const done = Object.values(state).filter(x => x && x.v).length;
  $('done').textContent = done;
  $('total').textContent = DATA.length;
  $('bar').style.width = (done / DATA.length * 100) + '%';
}

function go(n){
  idx = Math.max(0, Math.min(DATA.length - 1, n));
  render();
  $('q').focus();
}

function setVerdict(v){
  const r = rec(idx);
  r.v = v;
  r.q = $('q').value.trim();
  save();
  render();
  $('msg').textContent = '已记：' + v;
  setTimeout(() => { $('msg').textContent = ''; }, 900);
  go(idx + 1);
}

document.querySelectorAll('.verdict button').forEach(b => {
  b.onclick = () => setVerdict(b.dataset.v);
});
$('next').onclick = () => { rec(idx).q = $('q').value.trim(); save(); go(idx + 1); };
$('prev').onclick = () => { rec(idx).q = $('q').value.trim(); save(); go(idx - 1); };

$('q').addEventListener('input', () => {
  rec(idx).q = $('q').value;
  save();
});

document.addEventListener('keydown', e => {
  const inArea = e.target.tagName === 'TEXTAREA';
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    rec(idx).q = $('q').value.trim(); save(); go(idx + 1);
    return;
  }
  if (inArea) return;
  if (e.key === '1') setVerdict('对');
  else if (e.key === '2') setVerdict('改');
  else if (e.key === '3') setVerdict('砍');
  else if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
});

$('export').onclick = () => {
  const rows = [['序号','issue','问题','核对结果']];
  DATA.forEach((it, i) => {
    const r = state[it.i] || {};
    rows.push([it.i, it.issue, (r.q || '').replace(/\r?\n/g, ' '), r.v || '']);
  });
  const csv = '\ufeff' + rows.map(r =>
    r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'qbank_result.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('reset').onclick = () => {
  if (!confirm('清空全部进度？导出的 CSV 不受影响。')) return;
  state = {}; save(); go(0);
};

go(0);
</script>
</body>
</html>
