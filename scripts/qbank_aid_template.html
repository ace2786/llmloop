<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库核对 · 140 道</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#fff; --line:#e3e1da; --ink:#1f1e1b; --dim:#6b6a64;
    --blue:#2563eb; --green:#15803d; --amber:#b45309; --red:#b91c1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid var(--line);
    padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{font-weight:600}
  .bar{flex:1; min-width:140px; height:8px; background:#eceae4; border-radius:4px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--green); transition:width .2s}
  .stat{color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  .stat b{color:var(--ink)}
  header button{
    border:1px solid var(--line); background:#fff; border-radius:6px;
    padding:6px 12px; cursor:pointer; font-size:14px; color:var(--ink);
  }
  header button:hover{background:#f3f2ee}
  main{max-width:1180px; margin:0 auto; padding:20px; display:grid; gap:16px;
       grid-template-columns:1fr 400px; align-items:start}
  @media (max-width:940px){ main{grid-template-columns:1fr} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px}
  .card + .card{margin-top:14px}
  .lab{font-size:12px; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; margin-bottom:6px}
  .big{font-size:17px; line-height:1.7}
  .quote{background:#fbfaf7; border-left:3px solid #d9d5c9; padding:10px 12px; border-radius:0 6px 6px 0;
         font-size:14px; color:#3a3934; white-space:pre-wrap; word-break:break-word}
  .ctx{font-size:13px; color:var(--dim); white-space:pre-wrap; word-break:break-word;
       max-height:190px; overflow:auto; background:#fbfaf7; padding:10px 12px; border-radius:6px}
  .meta{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--dim); align-items:center}
  .meta a{color:var(--blue); text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .pill{border-radius:999px; padding:1px 9px; font-size:12px; border:1px solid var(--line)}
  .pill.must{background:#eef6ff; border-color:#bfdbfe; color:#1d4ed8}
  .pill.opt{background:#f5f4ef; color:#6b6a64}
  .pill.okpill{background:#e1f5ee; border-color:#5dcae5; color:#0f6e56; border-color:#5dcaa5}
  .pill.enpill{background:#fef3c7; border-color:#fcd34d; color:#92400e}
  .pill.cutpill{background:#fee2e2; border-color:#fca5a5; color:#991b1b}

  textarea{
    width:100%; min-height:120px; resize:vertical; padding:12px; border-radius:8px;
    border:1px solid var(--line); font:15px/1.6 inherit; background:#fff; color:var(--ink);
  }
  textarea:focus{outline:2px solid #bfdbfe; border-color:#93c5fd}
  .hint{font-size:12px; color:var(--dim); margin-top:6px}

  .verdict{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  .verdict button{
    padding:12px 8px; border-radius:8px; border:1px solid var(--line); background:#fff;
    cursor:pointer; font-size:15px; font-weight:500; color:var(--ink);
  }
  .verdict button kbd{display:block; font-size:11px; color:var(--dim); font-weight:400; margin-top:2px}
  .verdict button.ok:hover{background:#f0fdf4; border-color:#86efac}
  .verdict button.ok.on{background:#dcfce7; border-color:#4ade80; color:var(--green)}
  .verdict button.fix:hover{background:#fffbeb; border-color:#fcd34d}
  .verdict button.fix.on{background:#fef3c7; border-color:#fbbf24; color:var(--amber)}
  .verdict button.cut:hover{background:#fef2f2; border-color:#fca5a5}
  .verdict button.cut.on{background:#fee2e2; border-color:#f87171; color:var(--red)}

  .nav{display:flex; gap:10px; margin-top:12px}
  .nav button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--line);
              background:#fff; cursor:pointer; font-size:14px; color:var(--ink)}
  .nav button:hover{background:#f3f2ee}
  .nav .next{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:500}
  .nav .next:hover{background:#1d4ed8}

  .done{color:var(--green); font-size:13px; margin-top:8px; min-height:18px}
  .topic{background:#eef6ff; border:1px solid #bfdbfe; color:#1e3a8a; padding:9px 12px;
         border-radius:8px; font-size:14px; margin-bottom:12px}
  .topic b{font-family:ui-monospace,Menlo,Consolas,monospace; background:#dbeafe;
           padding:1px 6px; border-radius:4px}
  details.reason{margin-top:10px; font-size:12px; color:var(--dim)}
  details.reason summary{cursor:pointer; color:#6b6a64}
  details.reason p{margin:6px 0 0; line-height:1.6}

  .asktitle{font-size:16px; font-weight:600; line-height:1.5; margin-bottom:8px;
            color:#1f1e1b; word-break:break-word}
  .askbody{font-size:14px; color:#4a4943; line-height:1.7; white-space:pre-wrap;
           word-break:break-word; max-height:230px; overflow:auto;
           background:#fbfaf7; padding:10px 12px; border-radius:6px}
  .askbody:empty{display:none}

  .warn{background:#fffbeb; border:1px solid #fde68a; color:#92400e; padding:10px 12px;
        border-radius:8px; font-size:13px; margin-bottom:14px}
  .flag{background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; padding:10px 12px;
        border-radius:8px; font-size:13px; margin-bottom:14px; line-height:1.5}
  .flag b{font-weight:600}
</style>
</head>
<body>
<header>
  <span class="brand">题库核对</span>
  <div class="bar"><i id="bar"></i></div>
  <span class="stat">已完成 <b id="done">0</b> / <b id="total">0</b></span>
  <span class="stat" id="pos">第 1 条</span>
  <span class="stat" id="flagged" style="color:#b91c1c"></span>
  <button id="export">导出 CSV</button>
  <button id="applyAll" style="background:#2563eb;color:#fff;border-color:#2563eb">按建议一键填完</button>
  <button id="reset">清空进度</button>
</header>

<main>
  <section>
    <div class="flag" id="errBox" style="display:none"></div>
    <div class="warn" id="storageWarn" style="display:none"></div>
    <div class="card">
      <div class="meta" style="margin-bottom:10px">
        <span id="seq" class="pill opt">#1</span>
        <span id="pri" class="pill must">必选</span>
        <span id="qtype" class="pill"></span>
        <span id="sugg" class="pill"></span>
        <a id="issue" href="#" target="_blank" rel="noopener">issue</a>
        <span id="seg" style="font-size:12px"></span>
      </div>
      <div class="lab">草稿答案（要核对的）</div>
      <div class="topic" id="topic" style="display:none">
        这条原文讲：<b id="topicName"></b>
      </div>
      <div class="big" id="ans"></div>
      <details class="reason" id="reasonBox" style="display:none">
        <summary>当初为什么选这条原文（AI 匹配说明，仅供参考）</summary>
        <p id="reasonText"></p>
      </details>
    </div>

    <div class="card" id="askCard">
      <div class="lab">用户原提问（题目要从它改写）</div>
      <div class="asktitle" id="askTitle"></div>
      <div class="askbody" id="askBody"></div>
    </div>

    <div class="card">
      <div class="lab">文档原文（答案必须被它支持）</div>
      <div class="quote" id="quote"></div>
    </div>

    <div class="card">
      <div class="lab">所在段落上下文</div>
      <div class="ctx" id="ctx"></div>
    </div>
  </section>

  <aside>
    <div class="flag" id="flag" style="display:none"></div>
    <div class="warn" id="warn" style="display:none"></div>

    <div class="card">
      <div class="lab">问题（已按用户原提问预填，可直接改）</div>
      <textarea id="q" placeholder="这里会自动填入用户原提问，你看着改就行"></textarea>
      <div class="hint">改完按 1（对）/ 2（要改）/ 3（砍掉）—— 按完自动到下一题</div>
    </div>

    <div class="card">
      <div class="lab">核对结果</div>
      <div class="verdict">
        <button class="ok" data-v="对">对<kbd>1</kbd></button>
        <button class="fix" data-v="改">要改<kbd>2</kbd></button>
        <button class="cut" data-v="砍">砍掉<kbd>3</kbd></button>
      </div>
      <div class="done" id="msg"></div>
      <div class="nav">
        <button id="prev">← 上一条</button>
        <button class="next" id="next">下一条 →</button>
      </div>
    </div>
  </aside>
</main>

<div id="csvBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45);
     z-index:99; padding:40px 20px; overflow:auto">
  <div style="max-width:900px; margin:0 auto; background:#fff; border-radius:10px; padding:18px">
    <div style="font-weight:600; margin-bottom:8px">下载被拦截，请手动复制</div>
    <div style="font-size:13px; color:#6b6a64; margin-bottom:10px">
      全选复制下面的内容，粘到记事本里存成 <code>qbank_result.csv</code>（编码选 UTF-8）。
    </div>
    <textarea id="csvText" style="width:100%; height:320px; font-family:ui-monospace,monospace;
      font-size:12px; padding:10px; border:1px solid #e3e1da; border-radius:8px"></textarea>
    <div style="text-align:right; margin-top:10px">
      <button onclick="document.getElementById('csvBox').style.display='none'"
        style="padding:8px 16px; border-radius:6px; border:1px solid #e3e1da; background:#fff; cursor:pointer">
        关闭
      </button>
    </div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/[];
const KEY = 'qbank_140_v1';

// ★ 预览面板是沙箱 iframe，localStorage 可能被禁。
//   以前 save() 没有 try/catch，一抛异常就把整个点击流程打断，表现为「点了没反应」。
let storageOK = true;
let warned = false;

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
// 清掉不属于当前数据集的旧键（题库换过版本，旧序号会对不上）
try {
  const valid = new Set(DATA.map(x => x.i));
  Object.keys(state).forEach(k => { if (!valid.has(k)) delete state[k]; });
} catch (e) { state = {}; }
let idx = 0;

const $ = id => document.getElementById(id);

function warnStorage(){
  if (warned) return;
  warned = true;
  const b = $('storageWarn');
  b.style.display = 'block';
  b.textContent = '⚠ 这个环境不能保存进度（预览面板限制）。进度只存在内存里，刷新就没了。'
    + '建议：做完立刻点「导出 CSV」，或者把文件下载到本地用浏览器打开。';
}

function save(){
  if (!storageOK) return;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    storageOK = false;
    warnStorage();
  }
}

// ★ 任何未捕获错误都显示出来，不要静默失败
window.addEventListener('error', ev => {
  const b = $('errBox');
  b.style.display = 'block';
  b.textContent = '✗ 页面出错：' + (ev.message || ev.error || '未知') + '（请把这条发给王子凡）';
});

function rec(i){ return state[DATA[i].i] || (state[DATA[i].i] = {q:'', v:''}); }

function render(){
  const it = DATA[idx];
  const r = rec(idx);
  $('seq').textContent = '第 ' + (idx + 1) + ' 条';
  $('pri').textContent = it.pri;
  $('pri').className = 'pill ' + (it.pri === '必选' ? 'must' : 'opt');
  const qt = $('qtype');
  qt.textContent = it.qtype || '';
  qt.className = 'pill ' + (it.qtype && it.qtype.indexOf('可直接用') >= 0 ? 'okpill'
    : it.qtype && it.qtype.indexOf('英文') >= 0 ? 'enpill' : 'opt');

  const sg = $('sugg');
  sg.textContent = '建议' + (it.sugg || '留');
  sg.className = 'pill ' + (it.sugg === '砍' ? 'cutpill' : 'okpill');
  $('issue').textContent = 'issue #' + it.issue;
  $('issue').href = it.url;
  $('seg').textContent = it.seg;
  $('ans').textContent = it.ans || '（空）';
  $('quote').textContent = it.quote || '（没有原文引用）';
  $('ctx').textContent = it.ctx || '（无上下文）';

  // 用户原提问（老师要求：题目必须从真实提问改写）
  $('askTitle').textContent = it.qtitle || '（未获取到原文）';
  $('askBody').textContent = it.qbody || '';

  // 这条原文讲什么（机械提取，不用猜）
  const tp = $('topic');
  if (it.topic) {
    tp.style.display = 'block';
    $('topicName').textContent = it.topic;
  } else {
    tp.style.display = 'none';
  }

  // 当初的匹配理由（常含原 issue 问的是什么）
  const rb = $('reasonBox');
  if (it.reason) {
    rb.style.display = 'block';
    $('reasonText').textContent = it.reason;
  } else {
    rb.style.display = 'none';
  }
  // 输入框：优先用你改过的；没改过就预填「用户原提问」（去掉标签前缀）
  const saved = (r.q === undefined || r.q === null) ? '' : r.q;
  $('q').value = saved !== '' ? saved : (it.qdefault || '');
  $('pos').textContent = '共 ' + DATA.length + ' 条';

  document.querySelectorAll('.verdict button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === r.v);
  });

  // 提示：没有原文引用时提醒
  const w = $('warn');
  if (!it.quote || it.quote.length < 8) {
    w.style.display = 'block';
    w.textContent = '⚠ 这条没有可用的文档原文，很可能不能出题，建议直接「砍掉」。';
  } else {
    w.style.display = 'none';
  }

  // 审计标记（机器预先筛出的问题，仅供参考，决定权在你）
  const f = $('flag');
  if (it.flag && it.flag.length) {
    f.style.display = 'block';
    f.innerHTML = '⚑ <b>审计标记：' + it.flag.join('、') + '</b><br>' +
      '这条机器已经看出问题了，多半该砍——但最终由你判断。';
  } else {
    f.style.display = 'none';
  }

  const done = Object.values(state).filter(x => x && x.v).length;
  $('done').textContent = done;
  $('total').textContent = DATA.length;
  $('bar').style.width = (done / DATA.length * 100) + '%';

  const nf = DATA.filter(x => x.flag && x.flag.length).length;
  $('flagged').textContent = nf ? '标红 ' + nf : '';
}

function go(n){
  idx = Math.max(0, Math.min(DATA.length - 1, n));
  render();
  $('q').focus();
}

function setVerdict(v){
  const r = rec(idx);
  r.v = v;
  r.q = $('q').value.trim();
  save();
  render();
  $('msg').textContent = '已记：' + v;
  setTimeout(() => { $('msg').textContent = ''; }, 900);
  go(idx + 1);
}

document.querySelectorAll('.verdict button').forEach(b => {
  b.onclick = () => setVerdict(b.dataset.v);
});
$('next').onclick = () => { rec(idx).q = $('q').value.trim(); save(); go(idx + 1); };
$('prev').onclick = () => { rec(idx).q = $('q').value.trim(); save(); go(idx - 1); };

$('q').addEventListener('input', () => {
  rec(idx).q = $('q').value;
  save();
});

document.addEventListener('keydown', e => {
  const inArea = e.target.tagName === 'TEXTAREA';
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    rec(idx).q = $('q').value.trim(); save(); go(idx + 1);
    return;
  }
  if (inArea) return;
  if (e.key === '1') setVerdict('对');
  else if (e.key === '2') setVerdict('改');
  else if (e.key === '3') setVerdict('砍');
  else if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
});

$('export').onclick = () => {
  const rows = [['序号','issue','问题','核对结果']];
  DATA.forEach((it) => {
    const r = state[it.i] || {};
    rows.push([it.i, it.issue, (r.q || '').replace(/\r?\n/g, ' '), r.v || '']);
  });
  const csv = '\ufeff' + rows.map(r =>
    r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');

  // 沙箱里可能禁止下载，降级成「弹出文本框自己复制」
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'qbank_result.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('msg').textContent = '已下载 qbank_result.csv';
  } catch (e) {
    const box = $('csvBox');
    box.style.display = 'block';
    $('csvText').value = csv;
    $('csvText').select();
    $('msg').textContent = '下载被拦截，请复制下面的内容';
  }
};

$('applyAll').onclick = () => {
  const nCut = DATA.filter(x => x.sugg === '砍').length;
  const ok = confirm(
    '把所有 ' + DATA.length + ' 条按建议填好？\n\n' +
    '· 建议留 ' + (DATA.length - nCut) + ' 条 → 填「对」\n' +
    '· 建议砍 ' + nCut + ' 条 → 填「砍」\n\n' +
    '填完你可以逐条改例外（有红标的都在最后，建议重点看一眼）。'
  );
  if (!ok) return;
  DATA.forEach(it => {
    const r = state[it.i] || (state[it.i] = {q: '', v: ''});
    r.v = (it.sugg === '砍') ? '砍' : '对';
    if (!r.q) r.q = it.qdefault || '';
  });
  save();
  go(0);
  $('msg').textContent = '已按建议填完 ' + DATA.length + ' 条';
};

$('reset').onclick = () => {
  if (!confirm('清空全部进度？导出的 CSV 不受影响。')) return;
  state = {}; save(); go(0);
};

go(0);
</script>
</body>
</html>
